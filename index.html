let projSort="stage";   // stage=依階段分組 / period=依執行期間
try{projSort=localStorage.getItem("pm_proj_sort")||"stage";}catch(e){}
function setProjSort(v){projSort=v;try{localStorage.setItem("pm_proj_sort",v);}catch(e){}renderProjects();}

const PIN_MAX=3;   // 專案卡片最多顯示幾筆釘選事項

function renderProjects(){
  const el=document.getElementById("view-projects");
  if(!db.projects.length){el.innerHTML=`<div class="sec-head"><h2>專案列表</h2><button class="btn primary sm" onclick="openProjModal()">＋ 新增專案</button></div><div class="empty"><p>還沒有任何專案</p><span>點「＋ 新增專案」開始</span></div>`;return;}

  // 三條追蹤線的資料
  const workLine=p=>{
    if(!p.works.length)return {txt:"尚無工程項目",dim:true};
    const withProg=p.works.filter(w=>w.progress).sort((a,b)=>(b.progressAt||"").localeCompare(a.progressAt||""));
    const done=p.works.filter(w=>w.status==="done").length;
    const doing=p.works.filter(w=>w.status==="doing").length;
    const stat=`${p.works.length} 項 · ${doing} 進行中 · ${done} 完成`;
    if(withProg.length)return {txt:`${stat}｜${withProg[0].progress}`,dim:false};
    return {txt:`${stat}｜尚未填寫進度`,dim:true};
  };
  const acctLine=p=>{
    const open=(p.acctTodos||[]).filter(a=>!a.done);
    if(!open.length)return {txt:"無待處理",dim:true};
    return {txt:`${open.length} 筆待處理：${open[0].text}`,dim:false,warn:true};
  };
  const midLine=p=>{
    const cps=p.workItems||[];
    const ready=cps.filter(c=>c.status==="done").length;
    let pend=0; cps.forEach(c=>(c.materials||[]).forEach(m=>{if(!m.got)pend++;}));
    const parts=[];
    let urg="";
    if(p.midReportDue){const u=urgency(p.midReportDue);if(u)urg=u;parts.push(`${p.midReportDue} 到期（${dueLabel(p.midReportDue)}）`);}
    if(cps.length)parts.push(`查核點 ${ready}/${cps.length}`);
    if(pend)parts.push(`待收 ${pend} 筆`);
    if(!parts.length)return {txt:"尚未設定期中報告",dim:true};
    return {txt:parts.join(" · "),dim:false,urg};
  };

  const line=(icon,label,d)=>`<div class="tk-line ${d.dim?"dim":""} ${d.warn?"warn":""} ${d.urg==="over"?"over":d.urg==="soon"?"soon":""}">
    <span class="tk-ico">${icon}</span><span class="tk-lab">${label}</span><span class="tk-txt">${esc(d.txt)}</span></div>`;

  // 計畫執行期間 + 時間進度條
  const periodBlock=p=>{
    if(!p.startDate&&!p.endDate)
      return `<div class="tile-period"><div class="tp-row"><span>執行期間未設定</span></div></div>`;
    const pct=periodProgress(p);
    const d=daysUntil(p.endDate);
    const cls=(d===null)?"":(d<0?"over":(d<=30?"soon":""));
    const left=(d===null)?"":(d<0?`已結束 ${-d} 天`:(d===0?"今天結束":`剩 ${d} 天`));
    return `<div class="tile-period">
      <div class="tp-row">
        <span class="tp-date">${esc(p.startDate||"—")} ～ ${esc(p.endDate||"—")}</span>
        <span class="tp-left ${cls}">${left}</span>
      </div>
      ${pct===null?"":`<div class="tp-bar ${cls==="over"?"over":""}"><span style="width:${pct}%"></span></div>
      <div class="tp-row"><span>執行期間已過 ${pct}%</span></div>`}
    </div>`;
  };

  // 卡片上可直接編輯的注意事項（＝釘選的事項）
  const pinBlock=p=>{
    const pins=(p.months||[]).filter(m=>m.pin&&!m.done);
    const show=pins.slice(0,PIN_MAX);
    return `<div class="tile-notes" onclick="event.stopPropagation()">
      ${show.map(n=>`<div class="tile-note">
        <div class="chk ${n.done?"on":""}" title="標記完成" onclick="event.stopPropagation();togglePinDone('${p.id}','${n.id}')"></div>
        <input class="tn-in" value="${esc(n.text)}" placeholder="事項內容"
          onclick="event.stopPropagation()" onchange="setPinText('${p.id}','${n.id}',this.value)">
        ${n.date?`<span class="tn-date">${esc(n.date.slice(5))}</span>`:""}
        ${(+n.delayCount||0)?`<span class="ev-delay">延${n.delayCount}</span>`:""}
        <button class="tn-x" title="從卡片取消釘選（事項仍保留）" onclick="event.stopPropagation();unpinItem('${p.id}','${n.id}')">✕</button>
      </div>`).join("")}
      ${pins.length>PIN_MAX?`<div class="tile-more">還有 ${pins.length-PIN_MAX} 筆釘選事項，進入專案可看全部</div>`:""}
      <div class="tile-noteadd">
        <input id="pin-new-${p.id}" placeholder="＋ 新增注意事項（直接在這裡打）" autocomplete="off"
          onclick="event.stopPropagation()"
          onkeydown="event.stopPropagation();if(event.key==='Enter')addPinItem('${p.id}')">
        <button onclick="event.stopPropagation();addPinItem('${p.id}')">＋</button>
      </div>
    </div>`;
  };

  const tile=p=>`<div class="proj-tile" onclick="openProject('${p.id}')">
      <button class="del-x tile-del" onclick="event.stopPropagation();delProject('${p.id}')" title="刪除專案">✕</button>
      <div class="tile-name">${esc(p.name)}</div>
      <div class="tile-tags">
        <span class="tag t-cat">${CATEGORIES[p.category]||"個案"}</span>
        ${projSort==="period"?`<span class="tag ${STAGES[p.stage].cls}">${STAGES[p.stage].label}</span>`:""}
      </div>
      ${periodBlock(p)}
      <div class="tk-lines">
        ${line("🔧","工程",workLine(p))}
        ${line("📊","會計",acctLine(p))}
        ${line("📋","期中",midLine(p))}
      </div>
      ${pinBlock(p)}
    </div>`;

  // 跨專案「本週該追什麼」：撈快到期/逾期日期
  const urgent=[];
  db.projects.forEach(p=>{
    const push=(dstr,label)=>{const u=urgency(dstr);if(u)urgent.push({proj:p.name,pid:p.id,label,date:dstr,d:daysUntil(dstr),u});};
    push(p.midReportDue,"期中報告繳交");
    push(p.midVisit,"期中查訪");
    push(p.finalVisit,"期末查訪");
    push(p.endDate,"計畫執行結束");
  });
  urgent.sort((a,b)=>(a.d||0)-(b.d||0));

  // ── 主體：依排序方式產生 ──
  let body="";
  if(projSort==="stage"){
    const groups=STAGE_KEYS.map(k=>({key:k,label:STAGES[k].label,cls:STAGES[k].cls,projs:db.projects.filter(p=>p.stage===k)}));
    body=groups.map(g=>g.projs.length?`
      <div class="stage-group">
        <div class="stage-group-head">
          <span class="tag ${g.cls}" style="font-size:13px">${g.label}</span>
          <span class="gcnt">${g.projs.length} 個專案</span>
        </div>
        <div class="proj-grid">${g.projs.map(tile).join("")}</div>
      </div>`:"").join("");
  }else{
    // 依執行期間：結束日近的在前，沒設結束日的排最後
    const sorted=db.projects.slice().sort((a,b)=>{
      const ae=a.endDate||"", be=b.endDate||"";
      if(!ae&&!be)return (a.name||"").localeCompare(b.name||"");
      if(!ae)return 1;
      if(!be)return -1;
      return ae.localeCompare(be);
    });
    body=`<div class="proj-grid">${sorted.map(tile).join("")}</div>`;
  }

  el.innerHTML=`
    <div class="sec-head"><div><h2>專案列表</h2><span class="hint">卡片顯示執行期間與工程、會計、期中三條追蹤線；下方注意事項可直接編輯</span></div>
      <button class="btn primary sm" onclick="openProjModal()">＋ 新增專案</button></div>

    <div class="sec-head" style="margin-bottom:18px">
      <div class="sort-bar">
        <button class="sb ${projSort==="stage"?"on":""}" onclick="setProjSort('stage')">依目前階段</button>
        <button class="sb ${projSort==="period"?"on":""}" onclick="setProjSort('period')">依執行期間</button>
      </div>
      <span class="hint">${projSort==="stage"?"照計畫書修正 → 簽約完成的階段分組":"結束日最近的排最前面，最急的先看"}</span>
    </div>

    ${urgent.length?`<div class="focus-box">
      <div class="focus-head">本週該追什麼<span class="focus-cnt">${urgent.length} 項</span></div>
      <div class="focus-list">
        ${urgent.slice(0,12).map(u=>`<div class="focus-item ${u.u==="over"?"over":u.u==="soon"?"soon":""}" onclick="openProject('${u.pid}')">
          <span class="fi-proj">${esc(u.proj)}</span>
          <span class="fi-label">${u.label}</span>
          <span class="fi-due">${u.date+" · "+dueLabel(u.date)}</span>
        </div>`).join("")}
      </div>
    </div>`:""}

    ${body}
  `;
}
/* 卡片上的注意事項操作 */
function setPinText(pid,mid,v){const p=P(pid);if(!p)return;const m=(p.months||[]).find(x=>x.id===mid);if(!m)return;
  const t=(v||"").trim();if(t){m.text=t;save();}else renderProjects();}
function unpinItem(pid,mid){const p=P(pid);if(!p)return;const m=(p.months||[]).find(x=>x.id===mid);
  if(m){m.pin=false;save();renderProjects();}}
function togglePinDone(pid,mid){const p=P(pid);if(!p)return;const m=(p.months||[]).find(x=>x.id===mid);
  if(m){m.done=!m.done;save();renderProjects();}}
function addPinItem(pid){const p=P(pid);if(!p)return;const t=val("pin-new-"+pid);if(!t)return;
  p.months=p.months||[];
  p.months.unshift({id:uid(),month:"",date:"",text:t,details:"",done:false,pin:true,delayCount:0,subtasks:[]});
  save();renderProjects();}

/* ---- 行事曆（整月）---- */
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth(); // month:0-11
function renderSchedule(){
  const el=document.getElementById("view-schedule");

  // 蒐集所有事件：專案事項（有日期）＋ 會計待處理（有日期）＋ 重要日期 ＋ 自訂事項
  const byDate={};
  const push=(dstr,ev)=>{if(dstr)(byDate[dstr]=byDate[dstr]||[]).push(ev)};
  db.projects.forEach(p=>{
    (p.months||[]).forEach(m=>{if(m.date)push(m.date,{type:"task",proj:p.name,text:m.text,done:m.done,pid:p.id,id:m.id,delay:+m.delayCount||0})});
    (p.acctTodos||[]).forEach(a=>{if(a.date)push(a.date,{type:"acct",proj:p.name,text:a.text,done:a.done,pid:p.id,id:a.id,delay:+a.delayCount||0})});
    if(p.midReportDue)push(p.midReportDue,{type:"milestone",proj:p.name,text:"期中報告繳交期限",pid:p.id});
    if(p.midVisit)push(p.midVisit,{type:"milestone",proj:p.name,text:"期中查訪",pid:p.id});
    if(p.finalVisit)push(p.finalVisit,{type:"milestone",proj:p.name,text:"期末查訪",pid:p.id});
    if(p.startDate)push(p.startDate,{type:"milestone",proj:p.name,text:"計畫執行起始",pid:p.id});
    if(p.endDate)push(p.endDate,{type:"milestone",proj:p.name,text:"計畫執行結束",pid:p.id});
  });
  (db.standaloneEvents||[]).forEach(e=>push(e.date,{type:"self",text:e.text,done:e.done,id:e.id,delay:+e.delayCount||0}));

  // 週日在最左：0=日,1=一,...,6=六
  const weekNames=["日","一","二","三","四","五","六"];
  const first=new Date(calYear,calMonth,1);
  const startBlank=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=isoDate(new Date());

  const cells=[];
  for(let i=0;i<startBlank;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);

  el.innerHTML=`
    <div class="sec-head">
      <div><h2>行事曆</h2><span class="hint">專案事項、會計待處理、重要日期會自動排入；點事項本體可改日期與內容</span></div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn sm" onclick="shiftMonth(-1)">← 上個月</button>
        <button class="btn sm" onclick="shiftMonth(0)">本月</button>
        <button class="btn sm" onclick="shiftMonth(1)">下個月 →</button>
      </div>
    </div>
    <div style="font-weight:800;font-size:16px;margin-bottom:12px">${calYear} 年 ${calMonth+1} 月</div>
    <div class="cal-weekhead">
      ${weekNames.map((w,i)=>`<div class="${i===0||i===6?"we":""}">週${w}</div>`).join("")}
    </div>
    <div class="cal-grid">
      ${cells.map((d,idx)=>{
        if(d===null)return `<div class="cal-cell blank"></div>`;
        const col=idx%7, weekend=(col===0||col===6);
        const ds=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const evs=byDate[ds]||[], isToday=ds===todayStr;
        return `<div class="cal-cell ${isToday?"today":""} ${weekend?"weekend":""} ${evs.length===0&&!isToday?"mob-empty":""}">
          <div class="cal-daynum">${d}
            <button class="cal-add" title="新增事項" onclick="openSelfEventModal('${ds}')">＋</button></div>
          <div class="cal-evs">
            ${evs.map(ev=>{
              const dly=ev.delay?`<span class="ev-delay">延${ev.delay}</span>`:"";
              if(ev.type==="milestone")
                return `<div class="ev ev-mile" title="重要日期，到「專案設定」修改" onclick="openProject('${ev.pid}');switchTab('settings')" style="cursor:pointer">
                  <span class="ev-proj">${esc(ev.proj)}</span>${esc(ev.text)}</div>`;
              if(ev.type==="self")
                return `<div class="ev ev-self ${ev.done?"done":""}">
                  <div class="chk ${ev.done?"on":""}" onclick="toggleSelfEvent('${ev.id}')"></div>
                  <span class="ev-body" title="點一下改日期與內容" onclick="openItemEdit('self','','${ev.id}')">${esc(ev.text)}${dly}</span>
                  <button class="ev-del" onclick="delSelfEvent('${ev.id}')">✕</button></div>`;
              if(ev.type==="acct")
                return `<div class="ev ev-acct ${ev.done?"done":""}">
                  <div class="chk ${ev.done?"on":""}" onclick="toggleAcctById('${ev.pid}','${ev.id}')"></div>
                  <div class="ev-body" title="會計待處理 · 點一下改日期與內容" onclick="openItemEdit('acct','${ev.pid}','${ev.id}')">
                    <span class="ev-proj">📊 ${esc(ev.proj)}</span>${esc(ev.text)}${dly}</div></div>`;
              return `<div class="ev ev-task ${ev.done?"done":""}">
                <div class="chk ${ev.done?"on":""}" onclick="toggleTaskById('${ev.pid}','${ev.id}')"></div>
                <div class="ev-body" title="點一下改日期與內容" onclick="openItemEdit('task','${ev.pid}','${ev.id}')">
                  <span class="ev-proj">${esc(ev.proj)}</span>${esc(ev.text)}${dly}</div></div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:14px">提示：專案事項要顯示在行事曆，請到該專案「事項」頁為它填上日期。灰底＝專案事項，橘底＝會計待處理，粉底＝自訂行程。「延 N」表示這件事被往後改過幾次。</p>
  `;
}
function shiftMonth(dir){
  if(dir===0){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();}
  else{calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}else if(calMonth>11){calMonth=0;calYear++;}}
  renderSchedule();
}
function isoDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function toggleTaskById(pid,mid){const p=P(pid);if(!p)return;const m=(p.months||[]).find(x=>x.id===mid);if(m){m.done^=1;save();render();}}
function toggleAcctById(pid,aid){const p=P(pid);if(!p)return;const a=(p.acctTodos||[]).find(x=>x.id===aid);if(a){a.done=!a.done;save();render();}}
/* 行事曆自訂事項 */
function openSelfEventModal(date){
  openModal("新增行事曆事項",`
    <div class="field"><label>日期</label><input type="date" id="m-sedate" value="${date||today()}"></div>
    <div class="field"><label>事項內容</label><textarea id="m-setext" rows="2" placeholder="例：拜訪客戶、繳交文件（與專案無關的行程也可）"></textarea></div>
    <div class="field"><label>備註（選填）</label><textarea id="m-senote" rows="2"></textarea></div>`,
  ()=>{const text=val("m-setext"),date=val("m-sedate");if(!text){alert("請輸入事項內容");return;}
    db.standaloneEvents.push({id:uid(),date,text,note:val("m-senote"),done:false,delayCount:0});closeModal();save();render();});
}
function toggleSelfEvent(id){const e=db.standaloneEvents.find(x=>x.id===id);if(e){e.done^=1;save();render();}}
function delSelfEvent(id){db.standaloneEvents=db.standaloneEvents.filter(e=>e.id!==id);save();render();}

/* ---- 本公司交付項目：跨專案彙整所有工程項目的執行狀況（唯讀總覽）---- */
function renderAI(){
  const el=document.getElementById("view-ai");
  if(!db.projects.length){el.innerHTML=`<div class="empty"><p>還沒有任何專案</p><span>先建立專案，再到各專案的「工程項目」登錄工作</span></div>`;return;}
  // 彙整所有專案的工程項目
  const all=[];
  db.projects.forEach(p=>p.works.forEach(w=>all.push({p,w})));
  const total=all.length;
  const doneCnt=all.filter(x=>x.w.status==="done").length;
  const doingCnt=all.filter(x=>x.w.status==="doing").length;
  const noneCnt=all.filter(x=>x.w.status==="none").length;

  el.innerHTML=`
    <div class="sec-head"><div><h2>工程總覽</h2><span class="hint">彙整所有專案的工程項目執行狀況；在各專案「工程項目」頁編輯，這裡同步呈現</span></div></div>
    <div class="stat-grid">
      <div class="stat"><div class="label">工程項目總數</div><div class="num">${total}</div>
        <div class="sub">跨 ${db.projects.length} 個客戶案</div></div>
      <div class="stat"><div class="label">進行中</div><div class="num">${doingCnt}</div>
        <div class="sub">未開始 ${noneCnt} 項</div></div>
      <div class="stat"><div class="label">已完成</div><div class="num">${doneCnt}</div>
        <div class="sub">${total?Math.round(doneCnt/total*100):0}% 的工程項目完成</div></div>
    </div>
    ${!total?`<div class="empty"><p>目前沒有任何工程項目</p><span>進入某個專案的「工程項目」頁新增</span></div>`:
    db.projects.filter(p=>p.works.length).map(p=>`
      <div style="margin-bottom:26px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <h3 style="font-size:16px;font-weight:800">${esc(p.name)}</h3>
          <span style="font-size:13px;color:var(--ink-soft)">${p.works.length} 個工程項目</span>
          <button class="btn sm ghost" style="margin-left:auto" onclick="openProject('${p.id}');switchTab('works')">前往編輯 →</button>
        </div>
        ${p.works.map(w=>{
          const st=WORK_STATUS[w.status]||WORK_STATUS.none;
          const sd=w.steps.filter(s=>s.done).length,stotal=w.steps.length;
          const pct=stotal?Math.round(sd/stotal*100):0;
          const nextStep=w.steps.find(s=>!s.done);
          const lastDone=[...w.steps].filter(s=>s.done&&s.date).sort((a,b)=>a.date<b.date?1:-1)[0];
          const cd=w.checkpoints.filter(c=>c.done).length;
          return `<div class="card"><div class="card-head" onclick="toggleCard('ov-${w.id}')">
            <span class="card-title">${esc(w.name)}</span>
            <span class="tag ${st.cls}">${st.label}</span>
            ${w.owner?`<span class="tag t-role">${esc(w.owner)}</span>`:""}
            <span style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)">
              ${stotal?`<div class="bar" style="width:60px;margin:0"><span style="width:${pct}%"></span></div>步驟 ${sd}/${stotal}`:'<span style="color:var(--ink-soft)">尚無步驟</span>'}</span>
          </div>
          <div class="card-body" id="body-ov-${w.id}" style="display:none">
            <div style="display:flex;gap:22px;flex-wrap:wrap;padding:12px 0 4px;font-size:13px;color:var(--ink-soft)">
              ${nextStep?`<span>下一步 <b style="color:var(--ink)">${esc(nextStep.text)}</b></span>`:(stotal?`<span style="color:var(--accent);font-weight:700">所有步驟已完成</span>`:"")}
              ${lastDone?`<span>最近完成 <b style="color:var(--ink)">${esc(lastDone.text)}</b>（${esc(lastDone.date)}）</span>`:""}
              ${w.checkpoints.length?`<span>查核點 <b style="color:var(--ink)">${cd}/${w.checkpoints.length}</b></span>`:""}
            </div>
            ${stotal?`<div class="sub-block"><div class="sub-title">執行步驟</div>
              <div class="chip-list">${w.steps.map(s=>`<div class="step ${s.done?"done":""}">
                <div class="chk ${s.done?"on":""}" style="pointer-events:none"></div>
                <span class="step-txt">${esc(s.text)}</span>
                ${s.date?`<span class="step-date">${esc(s.date)}</span>`:""}</div>`).join("")}</div></div>`:""}
            ${w.dataNeeded?`<div class="sub-block"><div class="sub-title">要收集的資料</div><div class="field-read">${esc(w.dataNeeded)}</div></div>`:""}
            ${w.items.length?`<div class="sub-block"><div class="sub-title">採購清單</div>
              <table><thead><tr><th>品項</th><th>數量／規格</th></tr></thead>
              <tbody>${w.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${esc(it.qty)}</td></tr>`).join("")}</tbody></table></div>`:""}
          </div></div>`;
        }).join("")}
      </div>`).join("")}
  `;
}

/* ---- 期中報告（整理報告所需資料）---- */
/* 期中報告：記住哪些查核點是展開的（不因重繪而收合） */
let mrOpen = {};
const MR_STATUS = {
  todo:{label:"未開始",cls:"t-plan"},
  collecting:{label:"資料收集中",cls:"t-run"},
  ready:{label:"資料已到齊",cls:"t-done"},
};
const MR_CONFIDENCE = {
  none:{label:"未評估",dot:"#b4b2a9"},
  ok:{label:"有把握",dot:"#639922"},
  risk:{label:"有風險",dot:"#ef9f27"},
  hard:{label:"可能達不到",dot:"#b0524a"},
};
const MR_TYPE = { image:"圖片", data:"數據", file:"文件" };
const MR_TYPE_CLS = { image:"t-role", data:"t-cat", file:"t-plan" };

/* ═══ 跨專案：會計總覽 ═══ */
function renderAcctAll(){
  const el=document.getElementById("view-acct");
  if(!db.projects.length){el.innerHTML=`<div class="empty"><p>還沒有任何專案</p><span>先建立專案，再到各案「經費」頁登錄會計問題</span></div>`;return;}

  let openTot=0, consTot=0, budTot=0, spentTot=0;
  db.projects.forEach(p=>{
    openTot+=(p.acctTodos||[]).filter(a=>!a.done).length;
    (p.budgetItems||[]).forEach(b=>{consTot+=(b.consNotes||[]).filter(c=>!c.done).length;});
    budTot+=(+p.budget||0);
    spentTot+=(p.budgetItems||[]).reduce((s,b)=>s+biSpentNew(b),0);
  });
  const ratio=budTot?Math.round(spentTot/budTot*100):0;

  const block=p=>{
    const open=(p.acctTodos||[]).filter(a=>!a.done);
    const done=(p.acctTodos||[]).filter(a=>a.done);
    const cons=[];
    (p.budgetItems||[]).forEach(b=>(b.consNotes||[]).filter(c=>!c.done).forEach(c=>cons.push({b,c})));
    const bud=+p.budget||0;
    const sp=(p.budgetItems||[]).reduce((s,b)=>s+biSpentNew(b),0);
    const pct=bud?Math.round(sp/bud*100):0;
    const over=sp>bud&&bud>0;
    const chip=a=>{
      const u=a.date?urgency(a.date):"";
      return `<div class="chip ${a.done?"done":""}">
        <div class="chk ${a.done?"on":""}" onclick="toggleAcctById('${p.id}','${a.id}')"></div>
        <span class="txt">${esc(a.text)}${a.note?`<span style="color:var(--ink-soft);font-size:12px">　${esc(a.note)}</span>`:""}</span>
        <span class="chip-date ${a.date?(u==="over"?"over":""):"none"}" title="點一下改日期與內容"
          onclick="openItemEdit('acct','${p.id}','${a.id}')">${a.date?esc(a.date)+(a.done?"":" · "+dueLabel(a.date)):"＋日期"}</span>
        ${(+a.delayCount||0)?`<span class="ev-delay">延${a.delayCount}</span>`:""}
        <button class="del-x" onclick="delAcctFor('${p.id}','${a.id}')">✕</button>
      </div>`;
    };
    return `<div class="gp-block">
      <div class="gp-head">
        <span class="gp-name">${esc(p.name)}</span>
        <span class="gp-meta">${open.length?`<b style="color:var(--rose)">${open.length} 筆未解決</b>`:"無待處理"}${cons.length?` · 耗材問題 ${cons.length} 筆`:""}</span>
        <button class="btn sm ghost gp-go" onclick="openProject('${p.id}');switchTab('budget')">前往經費頁 →</button>
      </div>
      <div class="gp-body">
        <div class="gp-sub">會計待處理</div>
        ${open.length?`<div class="chip-list">${open.map(chip).join("")}</div>`:`<div class="gp-none">目前沒有未解決的會計問題。</div>`}
        <div class="inline-add">
          <input id="ga-new-${p.id}" placeholder="新增會計問題，例：8月人事費轉帳金額對不上" style="flex:2;min-width:220px"
            onkeydown="if(event.key==='Enter')addAcctFor('${p.id}')">
          <input type="date" id="ga-date-${p.id}" title="日期（選填，填了會排進行事曆）">
          <button class="btn sm primary" onclick="addAcctFor('${p.id}')">＋ 新增</button>
        </div>
        ${done.length?`<div class="gp-sub">已解決 ${done.length} 筆</div><div class="chip-list">${done.map(chip).join("")}</div>`:""}
        ${cons.length?`<div class="gp-sub">耗材待處理問題</div><div class="chip-list">
          ${cons.map(({b,c})=>`<div class="chip">
            <div class="chk" onclick="toggleConsNoteFor('${p.id}','${b.id}','${c.id}')"></div>
            <span class="txt">${esc(c.text)} <span style="color:var(--ink-soft);font-size:12px">｜${esc(b.name)}</span></span>
          </div>`).join("")}</div>`:""}
        <div class="gp-sub">經費執行</div>
        <div class="gp-stat">
          <span>總經費 <b>${money(bud)}</b></span>
          <span>已動支 <b class="${over?"bad":""}">${money(sp)}</b></span>
          <span>執行率 <b class="${over?"bad":""}">${pct}%</b></span>
        </div>
        <div class="mini-bar ${over?"over":""}"><span style="width:${Math.min(pct,100)}%"></span></div>
      </div>
    </div>`;
  };

  // 未解決的排前面
  const sorted=db.projects.slice().sort((a,b)=>
    (b.acctTodos||[]).filter(x=>!x.done).length-(a.acctTodos||[]).filter(x=>!x.done).length);

  el.innerHTML=`
    <div class="sec-head"><div><h2>會計</h2><span class="hint">所有專案跟會計相關的待處理一次看完；填了日期的會同時出現在行事曆</span></div></div>
    <div class="stat-grid">
      <div class="stat"><div class="label">未解決會計問題</div><div class="num" style="${openTot?"color:var(--rose)":""}">${openTot}</div>
        <div class="sub">跨 ${db.projects.length} 個專案</div></div>
      <div class="stat"><div class="label">耗材待處理</div><div class="num">${consTot}</div>
        <div class="sub">發票品名不符、規格要改等</div></div>
      <div class="stat"><div class="label">整體經費執行率</div><div class="num">${ratio}%</div>
        <div class="sub">已動支 ${money(spentTot)} / ${money(budTot)}</div>
        <div class="bar"><span style="width:${Math.min(ratio,100)}%"></span></div></div>
    </div>
    ${sorted.map(block).join("")}
  `;
}
function addAcctFor(pid){const p=P(pid);if(!p)return;const t=val("ga-new-"+pid);if(!t)return;
  p.acctTodos=p.acctTodos||[];
  p.acctTodos.push({id:uid(),text:t,done:false,date:val("ga-date-"+pid),note:"",delayCount:0});
  render();}
function delAcctFor(pid,aid){const p=P(pid);if(!p)return;p.acctTodos=(p.acctTodos||[]).filter(a=>a.id!==aid);render();}
function toggleConsNoteFor(pid,bid,cid){const p=P(pid);if(!p)return;
  const b=(p.budgetItems||[]).find(x=>x.id===bid);if(!b)return;
  const cn=(b.consNotes||[]).find(x=>x.id===cid);if(cn){cn.done=!cn.done;render();}}

/* ═══ 跨專案：期中報告總覽 ═══ */
function renderMidAll(){
  const el=document.getElementById("view-mid");
  if(!db.projects.length){el.innerHTML=`<div class="empty"><p>還沒有任何專案</p><span>先建立專案，再到各案「期中報告」頁登錄查核點</span></div>`;return;}

  // 跨專案待收資料
  const pending=[];
  db.projects.forEach(p=>(p.workItems||[]).forEach(cp=>(cp.materials||[]).forEach(m=>{
    if(!m.got)pending.push({p,cp,m});
  })));
  let cpTot=0,cpReady=0,riskTot=0;
  db.projects.forEach(p=>{const cps=p.workItems||[];cpTot+=cps.length;
    cpReady+=cps.filter(c=>c.status==="done").length;
    riskTot+=cps.filter(c=>c.confidence==="risk"||c.confidence==="hard").length;});

  const block=p=>{
    const cps=p.workItems||[];
    const ready=cps.filter(c=>c.status==="done").length;
    const ok=cps.filter(c=>c.confidence==="ok").length;
    const risk=cps.filter(c=>c.confidence==="risk").length;
    const hard=cps.filter(c=>c.confidence==="hard").length;
    let pend=0;cps.forEach(c=>(c.materials||[]).forEach(m=>{if(!m.got)pend++;}));
    const u=p.midReportDue?urgency(p.midReportDue):"";
    const pct=cps.length?Math.round(ready/cps.length*100):0;
    return `<div class="gp-block">
      <div class="gp-head">
        <span class="gp-name">${esc(p.name)}</span>
        <span class="gp-meta ${u==="over"?"warn-txt":""}">${p.midReportDue?`繳交期限 ${esc(p.midReportDue)}（${dueLabel(p.midReportDue)}）`:"未設定繳交期限"}${p.midVisit?` · 查訪 ${esc(p.midVisit)}`:""}</span>
        <button class="btn sm ghost gp-go" onclick="openProject('${p.id}');switchTab('midreport')">前往編輯 →</button>
      </div>
      <div class="gp-body">
        <div class="gp-stat">
          <span>查核點 <b>${ready}/${cps.length}</b> 資料到齊</span>
          <span>有把握 <b>${ok}</b>・有風險 <b class="${risk?"bad":""}">${risk}</b>・可能達不到 <b class="${hard?"bad":""}">${hard}</b></span>
          <span>待收資料 <b class="${pend?"bad":""}">${pend}</b> 筆</span>
        </div>
        <div class="mini-bar"><span style="width:${pct}%"></span></div>
        ${cps.length?`<div class="gp-sub">查核點狀態</div><div class="chip-list">
          ${cps.map(cp=>{
            const st=WI_STATUS[cp.status]||WI_STATUS.todo;
            const cf=MR_CONFIDENCE[cp.confidence]||MR_CONFIDENCE.none;
            const np=(cp.materials||[]).filter(m=>!m.got).length;
            return `<div class="chip">
              <span class="conf-dot" title="達成信心：${cf.label}" style="background:${cf.dot}"></span>
              <span class="txt">${esc(cp.name)}</span>
              ${np?`<span class="tag t-over">待收 ${np}</span>`:""}
              <span class="tag ${st.cls}">${st.label}</span>
            </div>`;}).join("")}
        </div>`:`<div class="gp-none" style="margin-top:10px">尚未建立查核點。</div>`}
      </div>
    </div>`;
  };

  // 期限近的排前面，沒設期限的最後
  const sorted=db.projects.slice().sort((a,b)=>{
    const ad=a.midReportDue||"",bd=b.midReportDue||"";
    if(!ad&&!bd)return 0; if(!ad)return 1; if(!bd)return -1;
    return ad.localeCompare(bd);
  });

  el.innerHTML=`
    <div class="sec-head"><div><h2>期中報告</h2><span class="hint">所有案子的期中報告進度一次看完；待收資料可直接在這裡標記收到</span></div></div>
    <div class="stat-grid">
      <div class="stat"><div class="label">查核點資料到齊</div><div class="num">${cpTot?Math.round(cpReady/cpTot*100):0}%</div>
        <div class="sub">${cpReady} / ${cpTot} 個查核點</div>
        <div class="bar"><span style="width:${cpTot?Math.round(cpReady/cpTot*100):0}%"></span></div></div>
      <div class="stat"><div class="label">要注意的查核點</div><div class="num" style="${riskTot?"color:var(--rose)":""}">${riskTot}</div>
        <div class="sub">有風險或可能達不到</div></div>
      <div class="stat"><div class="label">跨專案待收資料</div><div class="num" style="${pending.length?"color:var(--rose)":""}">${pending.length}</div>
        <div class="sub">${pending.length?"下面可直接標記收到":"全部到齊 ✓"}</div></div>
    </div>

    ${pending.length?`<div class="card"><div style="padding:16px 18px">
      <div class="sub-title" style="margin-bottom:10px;color:var(--rose)">⚠ 待收資料催收清單（共 ${pending.length} 筆）</div>
      <div class="chip-list">
        ${pending.map(({p,cp,m})=>`<div class="chip">
          <span class="tag ${MR_TYPE_CLS[m.type]}" style="flex-shrink:0">${MR_TYPE[m.type]}</span>
          <span class="txt"><b>${esc(p.name)}</b>　${esc(m.name)}${m.who?` <span style="color:var(--ink-soft)">— 找 ${esc(m.who)}</span>`:""}
            <span style="color:var(--ink-soft);font-size:12px">｜${esc(cp.name)}</span></span>
          <button class="btn sm ghost" onclick="toggleMrMatFor('${p.id}','${cp.id}','${m.id}')" title="標記已收到">收到 ✓</button>
        </div>`).join("")}
      </div>
    </div></div>`:""}

    ${sorted.map(block).join("")}
  `;
}
function toggleMrMatFor(pid,cid,mid){const p=P(pid);if(!p)return;
  const c=(p.workItems||[]).find(x=>x.id===cid);if(!c)return;
  const m=(c.materials||[]).find(x=>x.id===mid);if(m){m.got=!m.got;render();}}

function renderMidreport(){
  const p=proj();
  const all=p.workItems||[];
  const due=p.midReportDue||"";
  // 期中只看繳交期限前該完成的查核點（沒設期限就全看）
  const cps=due?all.filter(c=>!c.dueDate||c.dueDate<=due):all;
  const later=due?all.length-cps.length:0;

  const doneCnt=cps.filter(c=>c.status==="done").length;
  const wSum=cps.reduce((s,c)=>s+(+c.weight||0),0);
  const wDone=cps.filter(c=>c.status==="done").reduce((s,c)=>s+(+c.weight||0),0);
  let pending=[];
  cps.forEach(cp=>(cp.materials||[]).forEach(m=>{ if(!m.got) pending.push({cp,m}); }));
  const pImg=pending.filter(x=>x.m.type==="image").length;
  const pData=pending.filter(x=>x.m.type==="data").length;
  const pFile=pending.filter(x=>x.m.type==="file").length;

  document.getElementById("view-midreport").innerHTML=`
    <div class="sec-head"><div><h2>期中報告</h2>
      <span class="hint">${esc(p.name)} · 跟「執行進度」是同一份查核點，這裡只看怎麼呈現、佐證資料到齊了沒</span></div>
      <button class="btn sm ghost" onclick="switchTab('progress')">去執行進度編輯 →</button></div>

    ${all.length?`
    <div class="stat-grid" style="margin-bottom:20px">
      <div class="stat"><div class="label">期中應完成查核點</div><div class="num">${cps.length}</div>
        <div class="sub">${doneCnt} 個已完成${later?` · 另有 ${later} 個排在期中之後`:""}</div></div>
      <div class="stat"><div class="label">期中應達進度</div><div class="num">${wSum}%</div>
        <div class="sub">實際 ${wDone}%${wDone<wSum?`，落後 ${wSum-wDone}%`:""}</div>
        <div class="bar ${wDone<wSum?"over":""}"><span style="width:${wSum?Math.min(100,Math.round(wDone/wSum*100)):0}%"></span></div></div>
      <div class="stat"><div class="label">達成信心</div>
        ${(()=>{const risk=cps.filter(c=>c.confidence==="risk").length,hard=cps.filter(c=>c.confidence==="hard").length,ok=cps.filter(c=>c.confidence==="ok").length;
          return `<div class="num" style="font-size:22px;${(risk+hard)?"color:var(--rose)":""}">${risk+hard?`${risk+hard} 個要注意`:`${ok} 個有把握`}</div>
          <div class="sub">${cps.length?`有把握 ${ok}・有風險 ${risk}・可能達不到 ${hard}`:"尚未評估"}</div>`;})()}</div>
      <div class="stat"><div class="label">待收資料</div><div class="num" style="${pending.length?"color:var(--rose)":""}">${pending.length}</div>
        <div class="sub">${pending.length?`圖片 ${pImg}・數據 ${pData}・文件 ${pFile}`:"全部到齊 ✓"}</div></div>
    </div>`:""}

    ${pending.length?`<div class="card"><div style="padding:16px 18px">
      <div class="sub-title" style="margin-bottom:10px;color:var(--rose)">⚠ 待收資料彙整（共 ${pending.length} 筆）</div>
      <div class="chip-list">
        ${pending.map(({cp,m})=>`<div class="chip">
          <span class="tag ${MR_TYPE_CLS[m.type]||"t-cat"}" style="flex-shrink:0">${MR_TYPE[m.type]||"文件"}</span>
          <span class="txt">${esc(m.name)}${m.who?` <span style="color:var(--ink-soft)">— 找 ${esc(m.who)}</span>`:""}
            <span style="color:var(--ink-soft);font-size:12px">｜${esc(cp.code||"")} ${esc(cp.name)}</span></span>
          <button class="btn sm ghost" onclick="toggleWiMat('${cp.id}','${m.id}')" title="標記已收到">收到 ✓</button>
        </div>`).join("")}
      </div>
    </div></div>`:""}

    <div class="sec-head" style="margin:22px 0 12px"><div><h2 style="font-size:16px">查核點呈現方式</h2></div></div>
    ${cps.length?cps.slice().sort((a,b)=>(a.dueDate||"9").localeCompare(b.dueDate||"9")).map(cp=>mrCheckpointCard(cp)).join(""):
      `<div class="empty"><p>還沒有查核點</p><span>到「執行進度」把計畫書的工作項目與預定查核點帶進來，這裡就會自動出現</span>
       <div style="margin-top:14px"><button class="btn primary" onclick="switchTab('progress')">前往執行進度</button></div></div>`}

    <div class="card" style="margin-top:20px"><div style="padding:16px 18px">
      <div class="sub-title" style="margin-bottom:8px">報告內容 / 筆記</div>
      <textarea id="mr-notes" rows="8" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);resize:vertical;font-family:inherit;font-size:14px;line-height:1.7" placeholder="跨查核點的整體想法、報告架構、要點…" onchange="setMrNotes(this.value)">${esc(p.midReportNotes||"")}</textarea>
    </div></div>
  `;
}

function mrCheckpointCard(cp){
  const open = !!mrOpen[cp.id];
  const st = WI_STATUS[cp.status]||WI_STATUS.todo;
  const mats = cp.materials||[];
  const gotCnt = mats.filter(m=>m.got).length;
  const subs = cp.subItems||[];
  return `<div class="card">
    <div class="card-head" onclick="toggleMrOpen('${cp.id}')">
      <span class="wi-code">${esc(cp.code||"—")}</span>
      <span class="tag ${st.cls}">${st.label}</span>
      <span class="conf-dot" title="達成信心：${(MR_CONFIDENCE[cp.confidence]||MR_CONFIDENCE.none).label}" style="background:${(MR_CONFIDENCE[cp.confidence]||MR_CONFIDENCE.none).dot}"></span>
      <span class="card-title" style="flex:1;min-width:120px">${esc(cp.name)}</span>
      <span style="font-size:12.5px;color:var(--ink-soft)">${cp.dueDate?rocDate(cp.dueDate):""}</span>
      <span style="font-size:12.5px;color:var(--ink-soft)">${mats.length?`資料 ${gotCnt}/${mats.length}`:"無資料"}</span>
      <span style="color:var(--ink-soft);font-size:13px">${open?"▲":"▼"}</span>
    </div>
    ${open?`<div class="card-body" style="padding-top:14px">
      <div class="wi-fields" style="margin-bottom:14px">
        <div class="field"><label>狀態</label>
          <select onchange="setMrStatus('${cp.id}',this.value)">
            ${Object.entries(WI_STATUS).map(([k,v])=>`<option value="${k}" ${cp.status===k?"selected":""}>${v.label}</option>`).join("")}
          </select></div>
        <div class="field"><label>達成信心</label>
          <select onchange="setMrConfidence('${cp.id}',this.value)">
            ${Object.entries(MR_CONFIDENCE).map(([k,v])=>`<option value="${k}" ${cp.confidence===k?"selected":""}>${v.label}</option>`).join("")}
          </select></div>
      </div>

      ${subs.length?`<div class="sub-block">
        <div class="sub-title">查核項目達成情形（報告要寫的數字）</div>
        <div class="chip-list">
          ${subs.map(s=>{const has=s.target!==""&&+s.target>0;
            const sp=has?Math.min(100,Math.round((+s.current||0)/(+s.target)*100)):(s.done?100:0);
            return `<div class="chip ${sp>=100?"done":""}">
              <span class="txt">${esc(s.text)}</span>
              <span class="tag ${sp>=100?"t-done":"t-bid"}">${has?`${s.current||0} / ${s.target} ${esc(s.unit)}`:(s.done?"已完成":"未完成")}</span>
            </div>`;}).join("")}
        </div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:8px">數字要改請到「執行進度」頁</div>

  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;

  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){document.getElementById("modalBg").classList.remove("show");saveHandler=null;}

document.getElementById("modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal();};

      <p style="font-size:12px;color:var(--ink-soft);margin-top:4px">建立後可在卡片展開處自由增刪修改步驟。查核點、採購清單也在展開處新增。</p>`}`,
  ()=>{const name=val("m-wname");if(!name){alert("請輸入項目名稱");return;}
    const content=val("m-wcontent"),owner=val("m-wowner"),status=val("m-wstatus"),dataNeeded=val("m-wdata");
    const workCode=val("m-wcode");
    if(w){w.name=name;w.content=content;w.owner=owner;w.status=status;w.dataNeeded=dataNeeded;w.workCode=workCode;}
    else{
      const tpl=val("m-wtpl");

      proj().works.push({id:uid(),name,content,owner,status,dataNeeded,workCode,checkpoints:[],items:[],steps});
    }
    closeModal();render();});
}

function setWorkProgress(wid,v){const w=proj().works.find(x=>x.id===wid);if(w){w.progress=v;w.progressAt=new Date().toISOString();save();}}

/* ---- 快速切換專案（任何頁面都可用；Ctrl / ⌘ + K）---- */
let jumpIdx=0, jumpHits=[];
function openJump(){
  if(!db.projects.length){alert("目前還沒有任何專案");return;}
  jumpIdx=0;
  document.getElementById("jumpBg").classList.add("show");
  const inp=document.getElementById("jumpInput");
  inp.value=""; renderJump("");
  setTimeout(()=>inp.focus(),30);
}
function closeJump(){document.getElementById("jumpBg").classList.remove("show");}
function renderJump(q){
  q=(q||"").trim().toLowerCase();
  jumpHits=db.projects.filter(p=>!q||(p.name||"").toLowerCase().indexOf(q)>=0);
  if(jumpIdx>=jumpHits.length)jumpIdx=0;
  document.getElementById("jumpList").innerHTML=jumpHits.length?jumpHits.map((p,i)=>{
    const stg=STAGES[p.stage]?STAGES[p.stage].label:"";
    const open=(p.months||[]).filter(m=>!m.done).length+(p.acctTodos||[]).filter(a=>!a.done).length;
    return `<div class="jump-item ${i===jumpIdx?"on":""}" onclick="jumpTo('${p.id}')">
      <span class="jn">${esc(p.name)}</span>
      <span class="jm">${esc(stg)}${open?` · 未完成 ${open}`:""}</span>
    </div>`;
  }).join(""):`<div class="jump-empty">找不到符合的專案</div>`;
}
function jumpTo(id){closeJump();openProject(id);}
(function(){
  const inp=document.getElementById("jumpInput");
  inp.addEventListener("input",function(){jumpIdx=0;renderJump(this.value);});
  document.addEventListener("keydown",function(e){
    const bg=document.getElementById("jumpBg");
    const isOpen=bg.classList.contains("show");
    if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();isOpen?closeJump():openJump();return;}
    if(!isOpen)return;
    if(e.key==="Escape"){e.preventDefault();closeJump();return;}
    if(e.key==="ArrowDown"){e.preventDefault();jumpIdx=Math.min(jumpIdx+1,Math.max(jumpHits.length-1,0));renderJump(inp.value);return;}
    if(e.key==="ArrowUp"){e.preventDefault();jumpIdx=Math.max(jumpIdx-1,0);renderJump(inp.value);return;}
    if(e.key==="Enter"){e.preventDefault();if(jumpHits[jumpIdx])jumpTo(jumpHits[jumpIdx].id);return;}
  });
})();

/* ═══════════════════════════════════════════════════════════════
   ☁ Google Drive 雲端自動同步模組
   ───────────────────────────────────────────────────────────────
   ⚠️ 之後你若要改網頁的其他功能，請「不要動」這整個框框內的程式碼。
   ⚠️ 只有下面這一行 CLOUD_CLIENT_ID 是你的專屬設定，換帳號才需要改。
   ═══════════════════════════════════════════════════════════════ */
const CLOUD_CLIENT_ID = "277958923565-8kbdod8dh0jtg9urraq15lur0295k7n9.apps.googleusercontent.com";

(function(){
  if(READONLY) return; // 分享版（唯讀）不啟用雲端同步

  const FILE_NAME = "專案管理_data.json";   // 存在你 Google Drive 的檔名
  const SCOPE = "https://www.googleapis.com/auth/drive.file";
  const TOKEN_KEY = "pm_cloud_token";      // 暫存登入權杖
  const AUTOCONNECT_KEY = "pm_cloud_auto"; // 記住使用者曾登入過，之後自動連
  const LOCAL_TIME_KEY = "pm_cloud_localtime"; // 本機上次同步的時間戳（用來比對雲端新舊）

  let accessToken = null;
  let fileId = null;
  let tokenClient = null;
  let syncing = false;
  let saveTimer = null;

  const statusEl = () => document.getElementById("cloudStatus");
  const btnEl = () => document.getElementById("cloudBtn");
  function setStatus(txt, color){
    const el = statusEl(); if(!el) return;
    el.textContent = txt || "";
    el.style.color = color || "var(--ink-soft)";
  }
  function setBtn(txt){ const b = btnEl(); if(b) b.textContent = txt; }

  // 等 Google 函式庫載入好
  function waitForGoogle(cb){
    if(window.google && google.accounts && google.accounts.oauth2){ cb(); return; }
    let n=0; const t=setInterval(()=>{
      if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(t); cb(); }
      else if(++n>50){ clearInterval(t); setStatus("雲端函式庫載入失敗", "var(--rose)"); }
    },100);
  }

  function initTokenClient(){
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLOUD_CLIENT_ID,
      scope: SCOPE,
      callback: (resp)=>{
        if(resp && resp.access_token){
          accessToken = resp.access_token;
          localStorage.setItem(AUTOCONNECT_KEY, "1");
          onConnected();
        } else {
          setStatus("登入未完成", "var(--rose)");
        }
      },
    });
  }

  // 使用者點「連結雲端」按鈕
  window.cloudButtonClick = function(){
    if(accessToken){
      // 已連線 → 詢問是否中斷
      if(confirm("目前已連結雲端並自動同步中。\n要中斷連結嗎？（資料仍會保留在你的 Google Drive）")){
        accessToken=null; fileId=null;
        localStorage.removeItem(AUTOCONNECT_KEY);
        setBtn("☁ 連結雲端"); setStatus("");
      }
      return;
    }
    if(!tokenClient){ setStatus("尚在初始化，請稍候再點一次", "var(--amber)"); return; }
    setStatus("開啟 Google 登入…", "var(--slate)");
    tokenClient.requestAccessToken({ prompt: "" });
  };

  // API 呼叫小工具
  async function api(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({ "Authorization": "Bearer " + accessToken }, opts.headers||{});
    const r = await fetch(url, opts);
    if(r.status === 401){ // 權杖過期
      accessToken = null;
      throw new Error("TOKEN_EXPIRED");
    }
    return r;
  }

  // 找雲端上的資料檔
  async function findFile(){
    const q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
    const r = await api("https://www.googleapis.com/drive/v3/files?q=" + q + "&spaces=drive&fields=files(id,modifiedTime)");
    const j = await r.json();
    return (j.files && j.files.length) ? j.files[0] : null;
  }

  // 下載雲端資料
  async function downloadFile(id){
    const r = await api("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media");
    return await r.json();
  }

  // 上傳（新建或更新）
  async function uploadFile(dataObj){
    const meta = { name: FILE_NAME, mimeType: "application/json" };
    const body = new Blob([JSON.stringify(dataObj)], { type: "application/json" });
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
    form.append("file", body);
    let url, method;
    if(fileId){
      url = "https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=multipart";
      method = "PATCH";
    } else {
      url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
      method = "POST";
    }
    const r = await api(url, { method, body: form });
    const j = await r.json();
    if(j.id) fileId = j.id;
    return j;
  }

  // 連線成功後：智慧比對雲端與本機的時間，自動決定同步方向
  async function onConnected(){
    setBtn("☁ 已連結"); setStatus("同步中…", "var(--slate)");
    try{
      const f = await findFile();  // 回傳含 modifiedTime
      if(f){
        fileId = f.id;
        const cloudTime = new Date(f.modifiedTime).getTime();          // 雲端最後修改時間
        const localTime = parseInt(localStorage.getItem(LOCAL_TIME_KEY) || "0", 10); // 本機上次同步時間

        if(cloudTime > localTime + 2000){
          // 雲端比本機新（換裝置、或別處改過）→ 自動用雲端版更新畫面
          const cloudData = await downloadFile(f.id);
          if(cloudData && cloudData.projects){
            db = migrate(cloudData);
            current = db.projects[0] ? db.projects[0].id : null;
            realSave();
            localStorage.setItem(LOCAL_TIME_KEY, String(cloudTime));
            render();
            setStatus("已載入雲端最新版 ✓ " + nowTime(), "var(--accent)");
            return;
          }
        }
        // 本機較新或相同 → 把本機上傳（順便更新時間戳）
        await pushLocal();
      } else {
        // 雲端還沒有檔 → 建立
        await pushLocal();
      }
      setStatus("已同步 ✓ " + nowTime(), "var(--accent)");
    }catch(e){
      if(e.message === "TOKEN_EXPIRED"){ reconnectSilently(); }
      else { setStatus("同步失敗，稍後重試", "var(--rose)"); console.error(e); }
    }
  }

  // 上傳本機資料，並記下這次同步時間
  async function pushLocal(){
    const j = await uploadFile(db);
    // 上傳後用回傳的 modifiedTime 更新本機時間戳（拿不到就用現在時間）
    let t = Date.now();
    if(j && j.id){
      try{
        const meta = await api("https://www.googleapis.com/drive/v3/files/" + j.id + "?fields=modifiedTime");
        const mj = await meta.json();
        if(mj.modifiedTime) t = new Date(mj.modifiedTime).getTime();
      }catch(_){}
    }
    localStorage.setItem(LOCAL_TIME_KEY, String(t));
    return j;
  }

  function nowTime(){ const d=new Date(); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }

  // 權杖過期時，靜默重新取得
  function reconnectSilently(){
    if(tokenClient){ setStatus("重新連線…", "var(--amber)"); tokenClient.requestAccessToken({ prompt: "" }); }
  }

  // 把雲端上傳掛到 save()：包住原本的 save，不改原邏輯
  const realSave = window.save;
  window.save = function(){
    realSave();               // ① 原本的本機儲存，完全不變
    if(accessToken){          // ② 若已連雲端，延遲 1.5 秒批次上傳（避免每次點擊都打 API）
      setStatus("編輯中…", "var(--slate)");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async ()=>{
        if(syncing) return; syncing = true;
        try{ await pushLocal(); setStatus("已同步 ✓ " + nowTime(), "var(--accent)"); }
        catch(e){
          if(e.message === "TOKEN_EXPIRED") reconnectSilently();
          else setStatus("同步失敗", "var(--rose)");
        }
        finally{ syncing = false; }
      }, 1500);
    }
  };

  // 當分頁重新切回前景，且已連雲端、目前沒在編輯 → 自動檢查雲端有無更新
  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState !== "visible") return;
    if(!accessToken || syncing) return;
    try{
      const f = await findFile();
      if(!f) return;
      fileId = f.id;
      const cloudTime = new Date(f.modifiedTime).getTime();
      const localTime = parseInt(localStorage.getItem(LOCAL_TIME_KEY) || "0", 10);
      if(cloudTime > localTime + 2000){
        const cloudData = await downloadFile(f.id);
        if(cloudData && cloudData.projects){
          db = migrate(cloudData);
          current = db.projects[0] ? db.projects[0].id : null;
          realSave();
          localStorage.setItem(LOCAL_TIME_KEY, String(cloudTime));
          render();
          setStatus("已載入雲端最新版 ✓ " + nowTime(), "var(--accent)");
        }
      }
    }catch(e){ if(e.message === "TOKEN_EXPIRED") reconnectSilently(); }
  });

  // 頁面載入：初始化 + 若之前登入過就自動連
  waitForGoogle(()=>{
    initTokenClient();
    if(localStorage.getItem(AUTOCONNECT_KEY) === "1"){
      setStatus("自動連線中…", "var(--slate)");
      tokenClient.requestAccessToken({ prompt: "" });
    }
  });
})();
/* ═══════════ ☁ 雲端同步模組結束 ═══════════ */
</script>
