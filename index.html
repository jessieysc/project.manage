<style>
:root{
  /* 色卡：#FAF0E4 淺底 · #EECFBB 膚 · #F6B99D 珊瑚 · #CB8A90 玫瑰 + 補：深褐字/主色/警告 */
  --ink:#43302b;--ink-soft:#9c8079;--line:#e6d3c4;--paper:#faf0e4;--panel:#fffaf4;
  --accent:#b56b74;--accent-soft:#f3ddd8;--amber:#c07a4e;--amber-soft:#fbe6d5;
  --rose:#b0524a;--rose-soft:#f6ddd7;--slate:#c98f79;--slate-soft:#f6e4d6;
  --radius:10px;--shadow:0 1px 2px rgba(26,29,33,.04),0 4px 16px rgba(26,29,33,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:50}
.head-inner{display:flex;align-items:center;gap:20px;padding:14px 0;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--accent);display:inline-block}
.brand .brand-logo{width:24px;height:24px;object-fit:contain;display:inline-block;vertical-align:middle}
.proj-select{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
select,input,textarea{font-family:inherit;font-size:14px}
.sel{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  color:var(--ink);font-weight:600;cursor:pointer;min-width:180px}
.sel:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;
  border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;transition:all .12s ease;
  display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#255650}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{color:var(--ink);background:var(--paper)}
.btn.sm{padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
.tab{padding:12px 16px;border:none;background:none;font-weight:700;font-size:15px;color:var(--ink-soft);
  cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .12s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-scope{display:flex;align-items:center;font-weight:800;font-size:14px;color:var(--ink);
  padding:12px 14px 12px 0;margin-right:4px;border-right:1px solid var(--line);white-space:nowrap}
.proj-context{display:flex;align-items:center;gap:8px}
.proj-context .sel{min-width:200px}
main{padding:64px 0 80px}
.view{display:none}.view.active{display:block}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat .label{font-size:13px;color:var(--ink-soft);font-weight:600}
.stat .num{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.stat .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bar.over>span{background:var(--rose)}
.view.active>.sec-head:first-child,.view.active>.stat-grid:first-child{margin-top:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec-head .hint{font-size:13px;color:var(--ink-soft);font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-head{padding:15px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;flex-wrap:wrap}
.card-head:hover{background:var(--paper)}
.card-title{font-weight:700;font-size:15.5px}
.card-body{padding:0 18px 18px;border-top:1px solid var(--line)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.t-plan{background:#f3e6d6;color:#9a7a4e}
.t-bid{background:var(--amber-soft);color:var(--amber)}
.t-run{background:#f7e0d0;color:#c06a3e}
.t-award{background:var(--accent-soft);color:var(--accent)}
.t-done{background:#e3ead9;color:#6e8352}
.t-over{background:var(--rose-soft);color:var(--rose)}
.t-role{background:var(--accent-soft);color:var(--accent)}
.t-cat{background:var(--slate-soft);color:var(--slate)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-btn{padding:7px 14px;border:none;background:var(--panel);color:var(--ink-soft);font-family:inherit;
  font-size:13.5px;font-weight:700;cursor:pointer}
.seg-btn:hover{color:var(--ink)}
.seg-btn.on{background:var(--accent-soft);color:var(--accent)}
.wi-group{margin-bottom:26px}
.wi-group-head{display:flex;align-items:center;gap:10px;padding:6px 2px 10px;border-bottom:2px solid var(--line);
  margin-bottom:12px;flex-wrap:wrap}
.wi-group-head.now{border-bottom-color:var(--accent)}
.wi-code-big{font-weight:800;font-size:17px;color:var(--accent);min-width:22px}
.wi-group-name{font-weight:800;font-size:15px}
.wi-group-w{margin-left:auto;font-size:13px;color:var(--ink-soft)}
.wi-sub-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 7px 2px}
.wi-code{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;color:var(--accent);
  min-width:28px;flex-shrink:0}
.wi-dim{opacity:.72}
.wi-fields{display:flex;flex-wrap:wrap;gap:12px}
.wi-fields .field{flex:1;min-width:120px;margin:0}
.wi-fields input,.wi-fields select,.wi-fields textarea{width:100%;padding:8px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper);font-family:inherit;font-size:14px}
.wi-sub{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wi-sub:last-of-type{border-bottom:none}
.wi-sub-text{flex:1;min-width:150px;padding:6px 9px;border:1px solid transparent;border-radius:6px;
  background:transparent;font-family:inherit;font-size:13.5px;color:var(--ink)}
.wi-sub-text:hover,.wi-sub-text:focus{border-color:var(--line);background:var(--paper)}
.wi-num{width:62px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);
  font-family:inherit;font-size:13px;text-align:right}
.wi-unit{width:52px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);
  font-family:inherit;font-size:13px}
.wi-slash{color:var(--ink-soft);font-size:13px}
.wi-sub-pct{font-size:12.5px;color:var(--ink-soft);min-width:40px;text-align:right;font-weight:700}
.wi-sub-pct.ok{color:#6e8352}
.note-list{display:flex;flex-direction:column;gap:8px}
.note-item2{display:flex;gap:10px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.note-item2.pinned{border-color:var(--accent);background:var(--accent-soft)}
.note-item2 .note-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.note-item2 .note-title-in{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-family:inherit;font-size:14px;font-weight:700}
.note-item2 .note-note-in{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-family:inherit;font-size:13px;line-height:1.6;resize:vertical;color:var(--ink-soft)}
.note-item2 .note-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.note-rank{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:2px}
.note-rank .rank-btn{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:11px;line-height:1;padding:2px 4px;border-radius:4px}
.note-rank .rank-btn:hover:not(:disabled){color:var(--accent);background:var(--accent-soft)}
.note-rank .rank-btn:disabled{opacity:.25;cursor:default}
.note-rank .rank-num{font-size:12px;font-weight:800;color:var(--ink-soft)}
.note-item2 .note-pin{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.tile-notes{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.tile-note{display:flex;gap:7px;align-items:baseline;font-size:12.5px;background:var(--accent-soft);border-radius:6px;padding:5px 9px;line-height:1.45}
.tile-note .t{color:var(--ink);flex:1}
.month-block{margin-bottom:22px}
.month-label{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.month-label .cnt{font-size:12px;font-weight:600;color:var(--ink-soft)}
.task{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
.task.done .task-txt{text-decoration:line-through;color:var(--ink-soft)}
.chk{width:19px;height:19px;border:2px solid var(--line);border-radius:5px;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"✓";color:#fff;font-size:12px;font-weight:800}
.task-txt{flex:1;font-size:14.5px;font-weight:500}
.task-wrap{margin-bottom:7px}
.task-wrap .task{margin-bottom:0}
.sub-count{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:700;color:var(--slate);background:var(--slate-soft);padding:1px 8px;border-radius:20px}
.task-detail .field label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.task-detail textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);resize:vertical;font-family:inherit;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:700;color:var(--ink-soft);font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;font-weight:600}
.money.over{color:var(--rose)}
.empty{text-align:center;padding:44px 20px;color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--panel)}
.empty p{font-weight:600;margin-bottom:5px;color:var(--ink)}
.empty span{font-size:13.5px}
.modal-bg{position:fixed;inset:0;background:rgba(26,29,33,.42);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:50px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(26,29,33,.25);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:18px;font-weight:800;padding:20px 22px 0}
.modal-body{padding:16px 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cons-summary{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:14px;margin:12px 0 4px}
.cons-summary b{font-weight:800}
.warn-txt{color:var(--rose)}
.budget-table{width:100%;border-collapse:collapse;font-size:13.5px}
.budget-table th{text-align:left;font-weight:700;color:var(--ink-soft);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.budget-table td{padding:10px 12px;border-bottom:1px solid var(--line)}
.budget-table th.num,.budget-table td.num{text-align:right}
.budget-table tfoot td{border-bottom:none}
.dsp-list{display:flex;flex-direction:column;gap:14px}
.mv-cell{width:110px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:inherit;font-size:13px}
.mv-cell.over{color:var(--rose);border-color:var(--rose)}
.conf-dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.prio-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.prio-item .prio-num{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.prio-item .txt{flex:1;font-size:14px}
.prio-item.done .txt{text-decoration:line-through;color:var(--ink-soft)}
.prio-item.done .prio-num{background:var(--ink-soft)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-foot{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}
.inline-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.inline-add input,.inline-add select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.del-x{color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:5px;background:none;border:none}
.del-x:hover{color:var(--rose);background:var(--rose-soft)}
.sub-block{margin-top:14px}
.sub-title{font-weight:700;font-size:13.5px;color:var(--ink-soft);margin-bottom:8px}
.chip-list{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:14px}
.chip .chk{margin-top:0}
.chip.done span.txt{text-decoration:line-through;color:var(--ink-soft)}
.chip .txt{flex:1}
.field-read{font-size:14px;padding:2px 0 10px;white-space:pre-wrap}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.contact-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;position:relative}
.contact-card .role{display:inline-block;margin-bottom:8px}
.contact-card .cname{font-weight:800;font-size:16px}
.contact-card .crow{font-size:13.5px;color:var(--ink-soft);margin-top:4px;display:flex;gap:6px}
.contact-card .crow b{color:var(--ink);font-weight:600;min-width:42px}
.contact-card .cactions{position:absolute;top:12px;right:12px;display:flex;gap:2px}

.btn.danger{border-color:var(--rose-soft)}
/* 專案方格卡片 */
.stage-group{margin-bottom:30px}
.stage-group-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.stage-group-head h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.stage-group-head .gcnt{font-size:12.5px;font-weight:700;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);padding:1px 9px;border-radius:20px}
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.proj-tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 17px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .12s,box-shadow .12s;position:relative}
.proj-tile:hover{border-color:var(--ink-soft);box-shadow:0 2px 4px rgba(26,29,33,.06),0 8px 22px rgba(26,29,33,.07)}
.proj-tile .tile-name{font-weight:800;font-size:15.5px;line-height:1.35;padding-right:22px}
.proj-tile .tile-tags{display:flex;gap:6px;flex-wrap:wrap}
.proj-tile .tile-meta{font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;margin-top:2px}
.proj-tile .tile-meta b{color:var(--ink);font-weight:700}
.proj-tile .tile-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.proj-tile .tile-bar>span{display:block;height:100%;background:var(--accent);border-radius:4px}
.proj-tile .tile-del{position:absolute;top:10px;right:8px}
.proj-tile .tile-alert{font-size:11.5px;font-weight:700;color:var(--rose);background:var(--rose-soft);padding:1px 8px;border-radius:20px}
.tk-lines{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.tk-line{display:flex;gap:7px;align-items:baseline;font-size:12.5px;line-height:1.45;padding:6px 9px;border-radius:7px;background:var(--paper);border-left:3px solid var(--line)}
.tk-line .tk-ico{flex:0 0 auto;font-size:13px}
.tk-line .tk-lab{flex:0 0 auto;font-weight:800;color:var(--ink-soft);min-width:28px}
.tk-line .tk-txt{flex:1;min-width:0;color:var(--ink)}
.tk-line.dim .tk-txt{color:var(--ink-soft)}
.tk-line.warn{border-left-color:var(--amber);background:var(--amber-soft)}
.tk-line.soon{border-left-color:var(--amber);background:var(--amber-soft)}
.tk-line.over{border-left-color:var(--rose);background:var(--rose-soft)}
.tk-line.over .tk-txt{color:var(--rose);font-weight:700}
.focus-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:26px}
.focus-head{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.focus-cnt{font-size:12.5px;font-weight:700;color:var(--rose);background:var(--rose-soft);padding:1px 10px;border-radius:20px}
.focus-list{display:flex;flex-direction:column;gap:6px}
.focus-item{display:flex;gap:10px;align-items:baseline;padding:8px 11px;border-radius:8px;background:var(--paper);border-left:3px solid var(--line);cursor:pointer;flex-wrap:wrap}
.focus-item:hover{background:var(--accent-soft)}
.focus-item.soon{border-left-color:var(--amber);background:var(--amber-soft)}
.focus-item.over{border-left-color:var(--rose);background:var(--rose-soft)}
.focus-item .fi-proj{font-weight:800;font-size:13px;flex:0 0 auto}
.focus-item .fi-label{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.focus-item .fi-due{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.focus-item.over .fi-due{color:var(--rose)}
@media(max-width:900px){.proj-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.proj-grid{grid-template-columns:1fr}}
.date-badge{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:1px 8px;border-radius:20px;vertical-align:middle}
.date-add{margin-left:8px;font-size:12px;color:var(--ink-soft);background:none;border:1px dashed var(--line);
  border-radius:20px;padding:1px 8px;cursor:pointer}
.date-add:hover{color:var(--accent);border-color:var(--accent)}
.pw{font-variant-numeric:tabular-nums;font-family:monospace;margin-right:8px}
/* 執行步驟 */
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.step .chk{margin-top:0}
.step.done .step-txt{text-decoration:line-through;color:var(--ink-soft)}
.step-txt{flex:1;font-size:14px;font-weight:500}
.step-date{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:1px 8px;border-radius:20px}
.step-date.empty{color:var(--ink-soft);background:none;border:1px dashed var(--line);cursor:pointer}
.step-progress{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.work-status-sel{padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-weight:600;font-size:13px}
/* 行事曆（整月月曆） */
.cal-weekhead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-weekhead div{text-align:center;font-weight:800;font-size:13px;color:var(--ink-soft);padding:4px 0}
.cal-weekhead div.we{color:var(--rose)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:110px;
  padding:6px 7px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cal-cell.blank{background:transparent;border:none}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.cal-cell.weekend{background:var(--paper)}
.cal-daynum{font-weight:800;font-size:13px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.cal-cell.weekend .cal-daynum{color:var(--rose)}
.cal-cell.today .cal-daynum{color:var(--accent)}
.cal-add{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:15px;line-height:1;padding:0 3px;border-radius:5px;opacity:0;transition:opacity .12s}
.cal-cell:hover .cal-add{opacity:1}
.cal-add:hover{color:var(--accent);background:var(--accent-soft)}
.cal-evs{display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.ev{font-size:11.5px;border-radius:6px;padding:4px 6px;line-height:1.35}
.ev-proj{display:block;font-size:10px;font-weight:700;color:var(--ink-soft);margin-bottom:1px}
.ev-mile{background:var(--amber-soft);color:#7a5a1e;border-left:3px solid var(--amber)}
.ev-task{background:var(--slate-soft);color:var(--ink);display:flex;gap:6px;align-items:flex-start}
.ev-task .chk{width:15px;height:15px;margin-top:1px}
.ev-task .chk.on::after{font-size:9px}
.ev-task.done{opacity:.55}
.ev-task.done .ev-body{text-decoration:line-through;color:var(--ink-soft)}
.ev-self{background:var(--accent-soft);color:#1f4f46;border-left:3px solid var(--accent);display:flex;gap:6px;align-items:flex-start}
.ev-self .chk{width:15px;height:15px;margin-top:1px}
.ev-self .chk.on::after{font-size:9px}
.ev-self.done{opacity:.55}
.ev-self.done .ev-body{text-decoration:line-through;color:var(--ink-soft)}
.ev-self .ev-del{margin-left:auto;color:var(--ink-soft);cursor:pointer;border:none;background:none;font-size:12px;padding:0 2px}
.ev-self .ev-del:hover{color:var(--rose)}
.ev-move{color:var(--ink-soft);cursor:pointer;border:none;background:none;font-size:12px;padding:0 2px;line-height:1}
.ev-move:hover{color:var(--accent)}
.ev-task .ev-move{margin-left:auto}
@media(max-width:760px){
  .cal-weekhead{display:none}
  .cal-grid{display:flex;flex-direction:column;gap:6px}
  .cal-cell{min-height:0;padding:8px 10px;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:8px}
  .cal-cell.blank{display:none}
  .cal-cell.mob-empty{display:none}
  .cal-daynum{font-size:14px;min-width:34px;flex:0 0 auto}
  .cal-cell .cal-evs{flex:1;min-width:0}
  .cal-add{opacity:1}
  .ev{font-size:13px;padding:5px 8px}.ev-proj{font-size:11px}
}

/* 唯讀分享模式 */
body.readonly .proj-select .btn,body.readonly .proj-select input,
body.readonly .btn.primary,body.readonly .del-x,body.readonly .inline-add,
body.readonly .sec-head .btn,body.readonly .card-head .btn,
body.readonly .contact-card .cactions,body.readonly .btn.danger,
body.readonly .ev-move,body.readonly .note-rank,
body.readonly .date-add{display:none !important}
body.readonly input[type=date]{pointer-events:none;opacity:.7}
body.readonly #view-settings select,body.readonly #p-stage{pointer-events:none;opacity:.85}
body.readonly #view-ai .btn{display:none !important}
body.readonly .work-status-sel{pointer-events:none;opacity:.85}
body.readonly .step-date.empty{display:none !important}
body.readonly .cal-add{display:none !important}
body.readonly .ev-self .ev-del{display:none !important}
body.readonly .task-detail .inline-add{display:none !important}
body.readonly .task-detail textarea{pointer-events:none;opacity:.85}
body.readonly #view-midreport textarea{pointer-events:none;opacity:.85}
body.readonly #view-midreport .inline-add{display:none !important}
body.readonly .proj-context .btn{display:none !important}
body.readonly .chk{cursor:default;pointer-events:none}
body.readonly .note-pin{pointer-events:none;opacity:.7}
body.readonly .note-title-in,body.readonly .note-note-in,body.readonly .prog-in{pointer-events:none;opacity:.85;background:var(--paper)}
body.readonly #view-budget select,body.readonly #view-budget input{pointer-events:none;opacity:.85}
body.readonly #view-midreport input[type=text],body.readonly #view-midreport input:not([type]){pointer-events:none;opacity:.85}
.ro-banner{display:none}
body.readonly .ro-banner{display:block;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;text-align:center;padding:7px 12px}
body.readonly .proj-name-ro{margin-left:auto;font-weight:700;font-size:15px;color:var(--ink)}

@media(max-width:640px){
  .stat .num{font-size:25px}.row2{grid-template-columns:1fr}.row3{grid-template-columns:1fr}.brand{font-size:18px}
  th,td{padding:8px 8px;font-size:13px}
}

/* ═══ 手機版排版優化 ═══ */
@media(max-width:680px){
  .wrap{padding:0 12px}
  main{padding:26px 0 60px}

  /* 頁首：改直向堆疊，按鈕不再擠成一團 */
  .head-inner{gap:10px;padding:10px 0}
  .proj-select{margin-left:0;width:100%;gap:8px}
  .proj-select .btn.sm{flex:0 0 auto}
  .sel{min-width:0;width:100%;flex:1 1 100%}
  .proj-context{width:100%;flex-wrap:wrap}
  .proj-context .sel{min-width:0;flex:1}
  #cloudStatus{flex:1 1 100%;text-align:right}

  /* 分頁標籤：可橫向滑動，不擠壓 */
  .tabs{gap:2px;-webkit-overflow-scrolling:touch}
  .tab{padding:10px 12px;font-size:14px}
  .tab-scope{padding:10px 10px 10px 0;font-size:13px}

  /* 統計卡：一排一格或兩格 */
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  main{padding:40px 0 60px}
  .stat{padding:13px 14px}
  .stat .num{font-size:22px}

  /* 卡片內距縮小 */
  .card-head{padding:12px 13px;gap:8px}
  .card-body{padding:0 13px 14px}
  .card-title{font-size:14.5px}

  /* 寬表格：外層可橫向捲動，避免撐破畫面 */
  .card-body table,#view-budget table,#view-settings table,#view-works table{min-width:100%}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* 區塊標題與按鈕 */
  .sec-head{gap:8px}
  .sec-head h2{font-size:17px}

  /* 彈窗：貼合手機、可捲動 */
  .modal-bg{padding:20px 10px}
  .modal h3{font-size:16.5px;padding:16px 16px 0}
  .modal-body{padding:14px 16px}
  .modal-foot{padding:12px 16px 16px}
  .modal-foot .btn{flex:1}

  /* 行內新增欄位改直向，好點擊 */
  .inline-add{flex-direction:column;align-items:stretch}
  .inline-add input,.inline-add select,.inline-add .btn{width:100%}

  /* 聯絡人／窗口卡片單欄 */
  .contact-grid{grid-template-columns:1fr}

  /* 待辦、清單項目觸控區加大 */
  .task{padding:12px 13px}
  .chk{width:22px;height:22px}
}
/* ═══ 手機版排版優化 結束 ═══ */

/* ═══ 新增：快速切換專案 ═══ */
.jump-bg{position:fixed;inset:0;background:rgba(26,29,33,.42);z-index:200;display:none;
  align-items:flex-start;justify-content:center;padding:80px 16px}
.jump-bg.show{display:flex}
.jump-box{background:var(--panel);border-radius:14px;max-width:520px;width:100%;
  box-shadow:0 20px 60px rgba(26,29,33,.28);overflow:hidden;animation:pop .14s ease}
.jump-box>input{width:100%;border:none;border-bottom:1px solid var(--line);padding:16px 18px;
  font-size:16px;font-weight:600;background:var(--panel);color:var(--ink);outline:none}
.jump-list{max-height:340px;overflow-y:auto;padding:6px}
.jump-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer}
.jump-item .jn{font-weight:700;font-size:14.5px;flex:1;min-width:0}
.jump-item .jm{font-size:12px;color:var(--ink-soft);flex:0 0 auto}
.jump-item.on{background:var(--accent-soft)}
.jump-item:hover{background:var(--accent-soft)}
.jump-empty{padding:22px;text-align:center;color:var(--ink-soft);font-size:13.5px}
.jump-foot{border-top:1px solid var(--line);padding:8px 14px;font-size:11.5px;color:var(--ink-soft);text-align:right}

/* ═══ 新增：專案卡片的執行期間 ═══ */
.tile-period{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.tile-period .tp-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-soft)}
.tile-period .tp-date{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.tile-period .tp-left{font-weight:700;flex:0 0 auto}
.tile-period .tp-left.soon{color:var(--amber)}
.tile-period .tp-left.over{color:var(--rose)}
.tile-period .tp-bar{height:5px;border-radius:4px;background:var(--line);overflow:hidden}
.tile-period .tp-bar>span{display:block;height:100%;background:var(--slate);border-radius:4px}
.tile-period .tp-bar.over>span{background:var(--rose)}

/* ═══ 新增：卡片上可直接編輯的釘選事項 ═══ */
.tile-notes .tile-note{align-items:center;gap:4px}
.tile-note .tn-in{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;
  font-size:12.5px;color:var(--ink);padding:2px 3px;border-radius:5px;line-height:1.4}
.tile-note .tn-in:focus{outline:none;background:var(--panel);box-shadow:0 0 0 1.5px var(--accent)}
.tile-note .tn-x{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:13px;
  line-height:1;padding:1px 4px;border-radius:4px;flex:0 0 auto}
.tile-note .tn-x:hover{color:var(--rose);background:var(--rose-soft)}
.tile-note .tn-date{font-size:11px;font-weight:700;color:var(--accent);flex:0 0 auto}
.tile-note .chk{width:15px;height:15px;margin-top:0;flex:0 0 auto}
.tile-note .chk.on::after{font-size:9px}
.tile-noteadd{display:flex;gap:5px;margin-top:6px}
.tile-noteadd input{flex:1;min-width:0;padding:5px 9px;border:1px dashed var(--line);border-radius:6px;
  background:transparent;font-family:inherit;font-size:12.5px}
.tile-noteadd input:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--panel)}
.tile-noteadd button{flex:0 0 auto;border:none;background:var(--accent-soft);color:var(--accent);
  font-weight:800;font-size:13px;border-radius:6px;padding:0 10px;cursor:pointer}
.tile-more{font-size:11.5px;color:var(--ink-soft);padding:2px 4px}

/* ═══ 新增：排序切換 ═══ */
.sort-bar{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.sort-bar .sb{border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;
  color:var(--ink-soft);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.sort-bar .sb.on{background:var(--accent);color:#fff}

/* ═══ 新增：事項頁 ═══ */
.item-group{margin-bottom:22px}
.item-group-head{font-weight:800;font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.item-group-head .cnt{font-size:12px;font-weight:600;color:var(--ink-soft)}
.item-group-head .gh-note{font-size:12px;font-weight:500;color:var(--ink-soft)}
.task.pinned{border-color:var(--accent);background:var(--accent-soft)}
.pin-btn{border:none;background:none;cursor:pointer;font-size:14px;line-height:1;padding:3px 5px;
  border-radius:5px;flex:0 0 auto;opacity:.35}
.pin-btn.on{opacity:1}
.pin-btn:hover{background:var(--accent-soft)}
.delay-badge{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:800;color:var(--rose);
  background:var(--rose-soft);padding:1px 8px;border-radius:20px;vertical-align:middle}
.date-badge.editable{cursor:pointer}
.date-badge.editable:hover{background:var(--accent);color:#fff}
.date-badge.over{background:var(--rose-soft);color:var(--rose)}
.date-badge.soon{background:var(--amber-soft);color:var(--amber)}
.task .note-rank{flex-direction:row;gap:0;padding-top:0;align-items:center}

/* ═══ 新增：跨專案 會計 / 期中報告 頁 ═══ */
.gp-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.gp-head{display:flex;align-items:center;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gp-head .gp-name{font-weight:800;font-size:15.5px}
.gp-head .gp-meta{font-size:12.5px;color:var(--ink-soft)}
.gp-head .gp-go{margin-left:auto}
.gp-body{padding:14px 17px}
.gp-sub{font-weight:700;font-size:12.5px;color:var(--ink-soft);margin:12px 0 7px}
.gp-sub:first-child{margin-top:0}
.gp-none{font-size:13px;color:var(--ink-soft)}
.chip .chip-date{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:1px 8px;border-radius:20px;flex:0 0 auto;cursor:pointer}
.chip .chip-date.none{color:var(--ink-soft);background:none;border:1px dashed var(--line)}
.chip .chip-date.over{color:var(--rose);background:var(--rose-soft)}
.mini-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.mini-bar>span{display:block;height:100%;background:var(--accent);border-radius:4px}
.mini-bar.over>span{background:var(--rose)}
.gp-stat{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft)}
.gp-stat b{color:var(--ink);font-weight:800}
.gp-stat .bad{color:var(--rose)}

/* ═══ 新增：行事曆事項可點編輯 ═══ */
.ev-body{cursor:pointer}
.ev-acct{background:var(--amber-soft);color:var(--ink);border-left:3px solid var(--amber);display:flex;gap:6px;align-items:flex-start}
.ev-acct .chk{width:15px;height:15px;margin-top:1px}
.ev-acct .chk.on::after{font-size:9px}
.ev-acct.done{opacity:.55}
.ev-acct.done .ev-body{text-decoration:line-through;color:var(--ink-soft)}
.ev-delay{display:inline-block;font-size:10px;font-weight:800;color:var(--rose);background:var(--rose-soft);
  padding:0 5px;border-radius:20px;margin-left:4px}

/* 唯讀模式：新元件一併鎖住 */
body.readonly #jumpBtn{display:inline-flex !important}
body.readonly .tile-noteadd,body.readonly .tile-note .tn-x,body.readonly .pin-btn{display:none !important}
body.readonly .tile-note .tn-in{pointer-events:none}
body.readonly .ev-body{cursor:default}
body.readonly .chip .chip-date{pointer-events:none}
body.readonly .date-badge.editable{pointer-events:none}
@media(max-width:680px){
  .jump-bg{padding:50px 10px}
  .sort-bar{width:100%}
  .sort-bar .sb{flex:1;text-align:center}
}
/* ═══ 新增樣式結束 ═══ */

<body>
<div class="ro-banner">唯讀分享檢視 · 由 ProjectHub 產生</div>
<header>

<script>
const STORE_KEY="pm_dashboard_v3_20260718";
const SNAPSHOT=readSnapshot();
const READONLY=!!SNAPSHOT;
let db=null,current=null;
let activeTab="projects";

function readSnapshot(){
  const el=document.getElementById("snapshot-data");
  if(!el||!el.textContent.trim())return null;
  try{const d=JSON.parse(el.textContent);return(d&&d.projects&&d.projects.length)?d:null;}catch(e){return null;}
}
function load(){
  if(SNAPSHOT)return migrate(SNAPSHOT);
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return migrate(JSON.parse(raw));}catch(e){}
  return migrate(SEED);
}
/* 舊版資料相容：補齊新欄位 */
function migrate(d){
  const STAGE_MAP={plan:"plan",prep:"acct",exec:"account",mid:"bind",done:"signed"}; // 舊→新階段對映
  d.standaloneEvents=d.standaloneEvents||[];  // 行事曆自訂事項（與專案無關）
  d.standaloneEvents.forEach(e=>{e.text=e.text||""; e.date=e.date||""; e.done=!!e.done;
    e.note=e.note||""; e.delayCount=+e.delayCount||0;});
  d.projects.forEach(p=>{
    p.budgetItems=p.budgetItems||[];
    // 總預算拆補助款/自籌款；舊資料沒有拆分時，暫把原總額當補助款
    if(p.budgetGov===undefined&&p.budgetSelf===undefined){p.budgetGov=+p.budget||0;p.budgetSelf=0;}
    p.budgetGov=+p.budgetGov||0; p.budgetSelf=+p.budgetSelf||0;
    p.budget=p.budgetGov+p.budgetSelf;   // 總預算 = 補助 + 自籌（自動）
    p.contacts=p.contacts||[];
    p.alerts=p.alerts||[];        // 重大事項提醒
    p.accounts=p.accounts||[];    // 系統帳密
    p.startDate=p.startDate||""; p.endDate=p.endDate||"";   // 計畫執行期間
    p.midReportDue=p.midReportDue||"";                       // 期中報告繳交期限
    p.midVisit=p.midVisit||""; p.finalVisit=p.finalVisit||"";// 期中／期末查訪
    p.stage=p.stage||"plan";                                 // 階段狀態
    if(!STAGE_KEYS.includes(p.stage))p.stage=STAGE_MAP[p.stage]||"plan"; // 舊階段值轉新
    p.category=p.category||"managed";                        // 專案類別：managed / case
    p.midReportNotes=p.midReportNotes||"";                   // 期中報告資料整理（暫存文字，內容之後再定）
    p.midReportItems=p.midReportItems||[];                   // 期中報告待整理項目清單
    (p.midReportItems||[]).forEach(it=>{it.done=!!it.done;});
    // 舊版「注意事項」一次性併入事項清單（沒日期的事項＝原本的注意事項）
    p.notes=p.notes||[];
    if(p.notes.length){
      const conv=p.notes.map(n=>({
        id:n.id||uid(),
        month:"", date:"",
        text:(n.title!==undefined?n.title:n.text)||"",
        details:n.note||"",
        done:false, pin:!!n.pin, delayCount:0, subtasks:[]
      })).filter(x=>x.text.trim());
      p.months=conv.concat(p.months||[]);   // 放最前面，維持原本手動排序
      p.notes=[];
    }
    p.acctTodos=p.acctTodos||[];                             // 會計待處理 {id,text,done,date,note,delayCount}
    (p.acctTodos||[]).forEach(a=>{a.text=a.text||""; a.done=!!a.done;
      a.date=a.date||""; a.note=a.note||""; a.delayCount=+a.delayCount||0;});
    p.priorities=[];                                         // 「接下來三件事」功能已移除，清空舊資料
    p.mrCheckpoints=p.mrCheckpoints||[];                     // 期中報告查核點 {id,name,status,note,materials:[{id,name,type,who,got}]}
    (p.mrCheckpoints||[]).forEach(cp=>{
      cp.status=cp.status||"todo";      // todo未開始 / collecting資料收集中 / ready已到齊
      cp.confidence=cp.confidence||"none"; // 達成信心 none未評/ok有把握/risk有風險/hard可能達不到
      cp.note=cp.note||"";
      cp.materials=cp.materials||[];    // 待收資料
      cp.materials.forEach(mt=>{ mt.type=mt.type||"file"; mt.who=mt.who||""; mt.got=!!mt.got; });
    });
    // 計畫架構：分項（A/B/C…）只存代碼與名稱，工作項目靠 code 開頭字母自動歸組
    p.sections=p.sections||[];
    (p.sections||[]).forEach(s=>{s.code=(s.code||"").toUpperCase(); s.name=s.name||"";});
    // 工作項目 = 計畫書「計畫架構」+「預定查核點」合併後的主檔（執行進度／期中報告共用同一份）
    p.workItems=p.workItems||[];
    // 舊版 mrCheckpoints 一次性轉為工作項目（避免同一件事存兩份）
    if(!p.workItems.length && (p.mrCheckpoints||[]).length){
      p.workItems=p.mrCheckpoints.map(cp=>({
        id:cp.id||uid(), code:"", name:cp.name||"", owner:"", weight:0, dueDate:"", startMonth:"",
        status:cp.status==="ready"?"done":(cp.status==="collecting"?"doing":"todo"),
        confidence:cp.confidence||"none", subItems:[],
        materials:(cp.materials||[]).map(m=>({...m,month:m.month||""})),
        note:"", reportNote:cp.note||""
      }));
    }
    (p.workItems||[]).forEach(w=>{
      w.code=(w.code||"").toUpperCase(); w.name=w.name||""; w.owner=w.owner||"";
      w.weight=+w.weight||0;
      w.dueDate=w.dueDate||"";        // 計畫書的「完成日期」
      w.startMonth=w.startMonth||"";  // 這項工作何時開始推進（空＝計畫起始月）
      w.status=w.status||"todo";      // todo未開始 / doing進行中 / done完成
      w.confidence=w.confidence||"none";
      w.note=w.note||"";              // 執行備註（落後原因、補救措施）
      w.reportNote=w.reportNote||"";  // 期中報告要怎麼呈現

      w.subItems.forEach(s=>{
        s.text=s.text||"";
        s.target=(s.target===""||s.target===undefined||s.target===null)?"":(+s.target||0);
        s.current=(s.current===""||s.current===undefined||s.current===null)?"":(+s.current||0);
        s.unit=s.unit||""; s.done=!!s.done;
      });

      w.materials.forEach(m=>{m.type=m.type||"file"; m.who=m.who||""; m.got=!!m.got; m.month=m.month||"";});
    });

    delete p.ai;           // 更舊的單筆 AI 欄位

    (p.months||[]).forEach(m=>{m.date=m.date||""; m.details=m.details||""; m.subtasks=m.subtasks||[];
      m.pin=!!m.pin;                       // 釘選 → 顯示在專案列表卡片
      m.delayCount=+m.delayCount||0;       // 延期次數（改到更晚的日期才計）
      m.month=m.month||(m.date?m.date.slice(0,7):"");
      (m.subtasks||[]).forEach(s=>{s.done=!!s.done;});});
    (p.works||[]).forEach(w=>{
      w.content=w.content||"";
      w.checkpoints=w.checkpoints||[];
      w.owner=w.owner||"";
      w.items=w.items||[];
      w.status=w.status||"none";        // 手動狀態：未開始/進行中/完成
      w.steps=w.steps||[];              // 執行步驟 {id,text,date,done}
      w.dataNeeded=w.dataNeeded||"";    // 要收集的資料（AI 類項目用）
      w.workCode=(w.workCode||"").toUpperCase(); // 對應計畫書工作項目代碼（A1/B2…），空＝未歸屬
      w.progress=w.progress||"";        // 目前進度（卡片顯示用）
      w.progressAt=w.progressAt||"";    // 進度更新時間戳（排序用）
      w.steps.forEach(s=>{s.date=s.date||""; s.done=!!s.done;});
    });
    (p.budgetItems||[]).forEach(b=>{
      b.spends=b.spends||[];
      b.status=b.status||"none";        // 動支狀態 none未動支/doing進行中/done已完成/ongoing持續執行中
      b.note=b.note||"";                // 選填備註
      // 科目編列拆補助/自籌；舊資料把原 budget 當補助
      if(b.gov===undefined&&b.self===undefined){b.gov=+b.budget||0;b.self=0;}
      b.gov=+b.gov||0; b.self=+b.self||0;
      b.budget=b.gov+b.self;            // 科目合計 = 補助 + 自籌
      // moved：累計動支金額（手填）；舊資料若有 spent/明細則帶入
      if(b.moved===undefined||b.moved===null){
        let init="";
        if(b.spent!==""&&b.spent!==undefined&&b.spent!==null)init=+b.spent||0;
        else{const legacy=(b.spends||[]).reduce((s,x)=>s+(+x.amount||0),0);if(legacy>0)init=legacy;}
        b.moved=init;
      }
      b.consumables=b.consumables||[];  // 耗材明細 {id,name,budget,bought,note} bought=已核銷
      (b.consumables||[]).forEach(c=>{c.name=c.name||""; c.budget=+c.budget||0; c.bought=+c.bought||0; c.note=c.note||"";});
      b.consNotes=b.consNotes||[];      // 耗材待處理問題 {id,text,done}
      (b.consNotes||[]).forEach(cn=>{cn.text=cn.text||""; cn.done=!!cn.done;});
    });
  });

}

/* 距某日期還有幾天（負數=已逾期）；非日期回傳 null */
function daysUntil(dstr){
  if(!dstr)return null;
  const t=new Date(dstr+"T00:00:00"), now=new Date(today()+"T00:00:00");
  if(isNaN(t))return null;
  return Math.round((t-now)/86400000);
}
/* 依剩餘天數給緊急度：over逾期 / soon 7天內 / "" 其他 */
function urgency(dstr){const d=daysUntil(dstr);if(d===null)return "";if(d<0)return "over";if(d<=7)return "soon";return "";}
/* 剩餘天數的人話標籤 */
function dueLabel(dstr){const d=daysUntil(dstr);if(d===null)return "";if(d<0)return `逾期 ${-d} 天`;if(d===0)return "今天";return `剩 ${d} 天`;}
function biSpent(b){return(b.spends||[]).reduce((s,x)=>s+(+x.amount||0),0);}

/* 事項排序：沒排日期的在前（保留手動順序），其餘照日期由近到遠 */
function splitItems(p){
  const arr=p.months||[];
  return {
    undated:arr.filter(m=>!m.date),
    dated:arr.filter(m=>m.date).slice().sort((a,b)=>a.date.localeCompare(b.date)),
  };
}
/* 改日期：新日期比原本晚 → 延期次數 +1（往前挪、首次填日期都不算） */
function applyNewDate(obj,nd){
  const old=obj.date||"";
  nd=(nd||"").trim();
  if(old&&nd&&nd>old)obj.delayCount=(+obj.delayCount||0)+1;
  obj.date=nd;
  if(obj.month!==undefined)obj.month=nd?nd.slice(0,7):(obj.month||"");
}
/* 延期標記 */
function delayTag(o,mini){
  const n=+o.delayCount||0;
  if(!n)return "";
  return mini?`<span class="ev-delay">延${n}</span>`:`<span class="delay-badge">延 ${n} 次</span>`;
}

  const s=new Date(p.startDate+"T00:00:00"),e=new Date(p.endDate+"T00:00:00"),n=new Date(today()+"T00:00:00");
  if(isNaN(s)||isNaN(e)||e<=s)return null;
  return Math.max(0,Math.min(100,Math.round((n-s)/(e-s)*100)));
}

/* ==================== 執行進度（計畫書工作項目 / 查核點主檔） ==================== */
const WI_STATUS={
  todo:{label:"未開始",cls:"t-plan"},
  doing:{label:"進行中",cls:"t-run"},
  done:{label:"完成",cls:"t-done"},
};
let progressView="section";   // section 依分項 / month 依月份
let wiOpen={};                // 工作項目展開狀態

/* 計畫期間的月份清單 ["2026-01", ...] */
function planMonths(p){
  if(!p.startDate||!p.endDate)return [];
  let d=new Date(p.startDate+"T00:00:00");const e=new Date(p.endDate+"T00:00:00");
  if(isNaN(d)||isNaN(e)||e<d)return [];
  d=new Date(d.getFullYear(),d.getMonth(),1);
  const out=[];let guard=0;
  while(d<=e&&guard++<72){out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  return out;
}
function monthLabel(m){const a=m.split("-");return `${a[0]} 年 ${+a[1]} 月`;}
function rocDate(s){ // 2026-03-31 → 115/03/31
  if(!s)return "";const a=s.split("-");if(a.length<3)return s;
  return `${(+a[0])-1911}/${a[1]}/${a[2]}`;
}

/* 單一工作項目的完成比例 0~1（依子項量化數字；沒有子項就看狀態） */
function wiPct(w){
  if(w.status==="done")return 1;   // 手動標記完成 → 直接算滿，不受子項數字沒填影響
  const subs=w.subItems||[];
  if(subs.length){
    let s=0;
    subs.forEach(x=>{
      if(x.target!==""&&+x.target>0) s+=Math.min(1,(+x.current||0)/(+x.target));
      else s+=x.done?1:0;
    });
    return s/subs.length;
  }
  return w.status==="done"?1:(w.status==="doing"?0.5:0);
}

/* 全案進度：預定（權重加總，以完成日期為準）／實際（保守：只算已完成）／細緻（依子項比例） */
function progressStats(p,asOf){
  const items=p.workItems||[];
  const day=asOf||today();
  const total=items.reduce((s,w)=>s+(+w.weight||0),0);
  const planned=items.filter(w=>w.dueDate&&w.dueDate<=day).reduce((s,w)=>s+(+w.weight||0),0);
  const actual=items.filter(w=>w.status==="done").reduce((s,w)=>s+(+w.weight||0),0);
  const detailed=items.reduce((s,w)=>s+(+w.weight||0)*wiPct(w),0);
  return {total,planned,actual,detailed:Math.round(detailed*10)/10,gap:actual-planned,count:items.length};
}

function sectionNameOf(p,code){const s=(p.sections||[]).find(x=>x.code===code);return s?s.name:"";}
function sectionWeight(items){return items.reduce((s,w)=>s+(+w.weight||0),0);}

function groupBySection(p){
  const map={};
  (p.workItems||[]).forEach(w=>{const k=((w.code||"").charAt(0)||"—").toUpperCase();(map[k]=map[k]||[]).push(w);});
  return Object.keys(map).sort().map(k=>({
    code:k,name:sectionNameOf(p,k),
    items:map[k].slice().sort((a,b)=>(a.code||"").localeCompare(b.code||"")),
  }));
}

/* 某個月：到期的、要推進的、要收的資料 */
function monthBuckets(p,m){
  const items=p.workItems||[];
  const due=items.filter(w=>w.dueDate&&w.dueDate.slice(0,7)===m);
  const active=items.filter(w=>{
    if(!w.dueDate||w.dueDate.slice(0,7)<=m)return false;
    if(w.status==="done")return false;
    if(w.startMonth)return w.startMonth<=m;
    return monthDiff(m,w.dueDate.slice(0,7))<=2;   // 沒填起始月：到期前兩個月開始提醒
  });
  const mats=[];
  items.forEach(w=>(w.materials||[]).forEach(mt=>{if(mt.month===m&&!mt.got)mats.push({w,mt});}));
  return {due,active,mats};
}
function monthDiff(a,b){ // b - a，以月為單位
  const x=a.split("-"),y=b.split("-");
  return (+y[0]-+x[0])*12+(+y[1]-+x[1]);
}

/* ---- 工作項目卡片 ---- */
function wiCard(p,w,dim){
  const open=!!wiOpen[w.id];
  const st=WI_STATUS[w.status]||WI_STATUS.todo;
  const subs=w.subItems||[];
  const mats=w.materials||[];
  const gotCnt=mats.filter(m=>m.got).length;
  const pct=Math.round(wiPct(w)*100);
  const overdue=w.dueDate&&w.status!=="done"&&w.dueDate<today();
  const linked=(p.works||[]).filter(x=>(x.workCode||"")===(w.code||"")&&w.code);
  return `<div class="card ${dim?"wi-dim":""}">
    <div class="card-head" onclick="toggleWiOpen('${w.id}')">
      <span class="wi-code">${esc(w.code||"—")}</span>
      <span class="card-title" style="flex:1;min-width:120px">${esc(w.name||"（未命名）")}</span>

function toggleWiOpen(id){wiOpen[id]=!wiOpen[id];render();}
function addWi(){
  const p=proj();p.workItems=p.workItems||[];
  const id=uid();
  p.workItems.push({id,code:"",name:"",owner:"",weight:0,dueDate:"",startMonth:"",status:"todo",confidence:"none",subItems:[],materials:[],note:"",reportNote:""});
  wiOpen[id]=true;render();
}
function delWi(id){if(!confirm("刪除這個工作項目？底下的查核項目與資料清單也會一起移除。"))return;
  const p=proj();p.workItems=p.workItems.filter(w=>w.id!==id);render();}
function findWi(id){return (proj().workItems||[]).find(w=>w.id===id);}
function setWi(id,k,v){const w=findWi(id);if(!w)return;
  w[k]=(k==="weight")?(+v||0):((k==="code")?String(v||"").toUpperCase().trim():v);
  render();}
function addWiSub(wid){
  const w=findWi(wid);const raw=val("wisub-"+wid);if(!raw)return;
  w.subItems.push(parseSubItem(raw));render();}
function setWiSub(wid,sid,k,v){const w=findWi(wid);const s=w.subItems.find(x=>x.id===sid);if(!s)return;
  s[k]=(k==="current"||k==="target")?(v===""?"":(+v||0)):v;render();}
function toggleWiSub(wid,sid){const w=findWi(wid);const s=w.subItems.find(x=>x.id===sid);if(!s)return;
  if(s.target!==""&&+s.target>0){ s.current=(+s.current||0)>=+s.target?0:+s.target; }
  else s.done=!s.done;
  render();}
function delWiSub(wid,sid){const w=findWi(wid);w.subItems=w.subItems.filter(x=>x.id!==sid);render();}
function addWiMat(wid){
  const w=findWi(wid);const name=val("wimat-name-"+wid);if(!name)return;
  const type=(document.getElementById("wimat-type-"+wid)||{}).value||"file";
  const who=val("wimat-who-"+wid);
  const month=(document.getElementById("wimat-month-"+wid)||{}).value||"";
  w.materials.push({id:uid(),name,type,who,month,got:false});render();}
function toggleWiMat(wid,mid){const w=findWi(wid);const m=(w.materials||[]).find(x=>x.id===mid);if(m){m.got=!m.got;render();}}
function delWiMat(wid,mid){const w=findWi(wid);w.materials=w.materials.filter(x=>x.id!==mid);render();}

/* 從「完成數位化建檔 ≥ 30 種產品」抓出 target=30、unit=種 */
function parseSubItem(raw){
  const t=String(raw).trim().replace(/^\d+[.、)]\s*/,"");
  const m=t.match(/[≥>＞]=?\s*([\d,]+(?:\.\d+)?)\s*([^\s,，。;；(（]{0,4})/);
  if(m){
    const num=+m[1].replace(/,/g,"");
    let unit=(m[2]||"").replace(/[^\u4e00-\u9fa5A-Za-z%]/g,"");
    if(unit.length>3)unit=unit.slice(0,3);
    return {id:uid(),text:t,target:num,current:0,unit,done:false};
  }
  return {id:uid(),text:t,target:"",current:"",unit:"",done:false};
}

function parseWiPaste(txt){
  const out=[];let cur=null;
  String(txt).split(/\r?\n/).forEach(line=>{
    const raw=line.trim();
    if(!raw){cur=null;return;}
    const cols=raw.split(/\t+|\s*\|\s*/).map(s=>s.trim()).filter(s=>s!=="");
    const isHead=cols.length>=2&&/^[A-Za-z]\d{1,2}$/.test(cols[0]);
    if(isHead){
      cur={id:uid(),code:cols[0].toUpperCase(),name:cols[1]||"",
        weight:+(String(cols[2]||"").replace(/[^\d.]/g,""))||0,
        dueDate:normDate(cols[3]||""),owner:cols[4]||"",
        startMonth:"",status:"todo",confidence:"none",subItems:[],materials:[],note:"",reportNote:""};
      out.push(cur);return;
    }
    if(cur){
      raw.split(/(?=\d+[.、]\s*完成)|(?=\d+[.、]\s*建立)|(?=\d+[.、]\s*累計)/).map(s=>s.trim()).filter(Boolean)
        .forEach(part=>{ if(part.length>1) cur.subItems.push(parseSubItem(part)); });
    }
  });
  return out;
}
function normDate(s){
  const t=String(s).trim().replace(/[年月]/g,"/").replace(/日/g,"");
  const m=t.match(/(\d{2,4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
  if(!m)return "";
  let y=+m[1];if(y<1911)y+=1911;   // 民國轉西元
  return `${y}-${String(+m[2]).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
}

function toggleItemPin(id){const m=proj().months.find(x=>x.id===id);if(m){m.pin=!m.pin;render();}}
/* 未排日期事項的手動排序（只在未排日期的項目之間交換） */
function moveItem(id,dir){
  const arr=proj().months;
  const idxs=arr.map((m,i)=>(!m.date&&(!hideDoneTasks||!m.done))?i:-1).filter(i=>i>=0);
  const pos=idxs.findIndex(i=>arr[i].id===id);
  if(pos<0)return;
  const np=pos+dir; if(np<0||np>=idxs.length)return;
  const a=idxs[pos],b=idxs[np];
  const t=arr[a];arr[a]=arr[b];arr[b]=t;
  render();
}
function setTaskDetails(id,v){proj().months.find(m=>m.id===id).details=v;save();}
function addSubtask(mid){const m=proj().months.find(x=>x.id===mid);const t=val("st-"+mid);if(!t)return;
  m.subtasks=m.subtasks||[];m.subtasks.push({id:uid(),text:t,done:false});render();keepOpen("task-"+mid);}
function toggleSubtask(mid,sid){const m=proj().months.find(x=>x.id===mid);
  m.subtasks.find(s=>s.id===sid).done^=1;render();keepOpen("task-"+mid);}
function delSubtask(mid,sid){const m=proj().months.find(x=>x.id===mid);
  m.subtasks=m.subtasks.filter(s=>s.id!==sid);render();keepOpen("task-"+mid);}

/* ── 事項／會計／自訂行程 共用的編輯視窗 ── */
const KIND_LABEL={task:"專案事項",acct:"會計待處理",self:"自訂行程"};
function getEnt(kind,pid,id){
  if(kind==="self")return (db.standaloneEvents||[]).find(x=>x.id===id);
  const p=P(pid); if(!p)return null;
  if(kind==="acct")return (p.acctTodos||[]).find(x=>x.id===id);
  return (p.months||[]).find(x=>x.id===id);
}
function openItemEdit(kind,pid,id){
  if(READONLY)return;
  const e=getEnt(kind,pid,id); if(!e)return;
  const p=pid?P(pid):null;
  const note=(kind==="task")?(e.details||""):(e.note||"");
  openModal(`編輯${KIND_LABEL[kind]}${p?"｜"+p.name:""}`,`
    <div class="field"><label>內容</label><textarea id="ie-text" rows="2">${esc(e.text||"")}</textarea></div>
    <div class="field"><label>日期${e.date?`（目前 ${esc(e.date)}）`:"（選填，填了才會出現在行事曆）"}</label>
      <input type="date" id="ie-date" value="${esc(e.date||"")}"></div>
    <div class="field"><label>備註</label><textarea id="ie-note" rows="3" placeholder="補充說明（選填）">${esc(note)}</textarea></div>
    ${kind==="task"?`<div class="field"><label style="display:flex;align-items:center;gap:7px;cursor:pointer">
      <input type="checkbox" id="ie-pin" ${e.pin?"checked":""} style="width:auto;margin:0">釘選到專案列表卡片</label></div>`:""}
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px">目前已延期 <b>${+e.delayCount||0}</b> 次。日期改到比原本更晚時，延期次數會 +1；往前挪不計。</p>
    <button class="btn sm danger" style="color:var(--rose)" onclick="delItemFromModal('${kind}','${pid||""}','${id}')">🗑 刪除這一筆</button>`,
  ()=>{
    const t=val("ie-text"); if(!t){alert("請輸入內容");return;}
    e.text=t;
    const nv=val("ie-note");
    if(kind==="task"){e.details=nv;const cb=document.getElementById("ie-pin");if(cb)e.pin=cb.checked;}
    else e.note=nv;
    applyNewDate(e,val("ie-date"));
    closeModal();render();
  });
}
function delItemFromModal(kind,pid,id){
  if(!confirm("確定刪除這一筆？"))return;
  if(kind==="self")db.standaloneEvents=(db.standaloneEvents||[]).filter(x=>x.id!==id);
  else{const p=P(pid);if(p){
    if(kind==="acct")p.acctTodos=(p.acctTodos||[]).filter(x=>x.id!==id);
    else p.months=(p.months||[]).filter(x=>x.id!==id);
  }}
  closeModal();render();
}
